velTag":"中"},{"q":"家长问：\"S4 里有个'隐藏与多余条件'专题，这是练什么的？是不是故意为难孩子？\" 正确的解释是：","opts":["排除多余条件、挖掘隐藏信息，解决“读题不清导致的结构误判”，是把题读懂的关键","主要是为了提高孩子的阅读速度，读得快了理解得快，做题速度自然就跟着上来了","是单纯为了增加题目难度，让孩子从小习惯有挑战的题，考试不至于发慌","是教孩子速算技巧，把计算又快又好地练出来，为后面的学习打好基础"],"correct":0,"source":"S4\"隐藏与多余条件：拓展《20 以内加减法》单元。排除多余条件干扰、挖掘隐藏信息，解决读题不清导致的结构误判。\"","explain":"【依据】S4\"隐藏与多余条件：拓展《20 以内加减法》单元。排除多余条件干扰、挖掘隐藏信息，解决读题不清导致的结构误判。\"　A 点明了该专题的真实价值——训练\"信息提取\"这一 S4 的底层能力（白皮书把它列为三大底层问题之一）。B、D 张冠李戴，把审题训练误说成阅读速度或速算。C 把它说成\"为难孩子\"，忽略了它对应的是白皮书明确点出的\"读题不清导致的结构误判\"。","id":"UP-S4-07","bank":"up","level":"S4","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子一遇到长一点、不太熟悉的文字题就发怵，直接空着不写。\" 按 S4，最合适的建议是：","opts":["遇到难题就先跳过，不用管它，等孩子能力上去了自然就能做出来，现在纠结也没用","让孩子把常见题型都背成模板，遇到就往模板上套，套对了就能得分","只做孩子熟悉的题，不碰新题，先把熟悉的练熟，保证不丢冤枉分","用“画图”把文字转成数量关系，先理清“整体与部分”再下笔，陌生题也有方法可依"],"correct":3,"source":"S4\"会画图，能把文字转成关系\"；\"孩子出现的变化：应用题更容易读懂，不再瞎凑数；后面学中高年级内容时，更能举一反三\"。","explain":"【依据】S4\"会画图，能把文字转成关系\"；\"孩子出现的变化：应用题更容易读懂，不再瞎凑数；后面学中高年级内容时，更能举一反三\"。　D 用\"画图建模\"化解畏难，且指向白皮书\"把文字转成关系\"的核心方法。A、C 都用回避来应对，孩子永远学不会面对新题。B 的背模板与白皮书\"不要瞎凑、要建模\"的取向相反，变式题很快就会击穿模板。","id":"UP-S4-08","bank":"up","level":"S4","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"你们总提 UPSC，一年级的 UPSC 具体是哪四步？\" 下列匹配正确的是：","opts":["U 直接计算，P 检查答案，S 回头读题，C 交卷给老师批改，四步走完","U 背口诀，P 刷题，S 抄答案，C 对答案，把四步变成日常习惯","U 读懂题圈关键词，P 想关系画图选方法，S 规范列式，C 复盘检查","以上都不对，这个提法本身就有问题，不能作为标准的答题流程来用"],"correct":2,"source":"S4\"打造终生受益的满分习惯：UPSC 核心解题法\"——Understand 深度理解 / Plan 规划思路 / Solve 精准执行 / Check 复盘检查。","explain":"【依据】S4\"打造终生受益的满分习惯：UPSC 核心解题法\"——Understand 深度理解 / Plan 规划思路 / Solve 精准执行 / Check 复盘检查。　C 与白皮书四步定义完全一致。A 顺序打乱且内涵错误。B 把 UPSC 降格为应试套路，与白皮书\"把不粗心变成肌肉记忆\"的习惯定位背道而驰。UPSC 是家长最容易记住、也最容易记混的部分，答错会直接影响专业形象。","id":"UP-S4-09","bank":"up","level":"S4","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子基础题做得挺快，但一遇'排队问题''数阵图'这类题就掉分，这些附加题是不是可以放弃？性价比太低了。\" 按 S4，正确的判断是：","opts":["附加题可以放弃，投入产出比太低，把同样的时间花在基础题上更划算也更稳妥","这类题是“从会几道题到会一类题”的关键——排队练基数序数与重叠计算，数阵图练逆向推理","只有走奥数路线的孩子才需要学这些，普通孩子把基础题做稳就够，不用浪费时间","让孩子多背几道原题，考试遇到原题就能直接套上去，省时又省力最划算"],"correct":1,"source":"S4\"难题思路：【不怕陌生题】遇到复杂'排队、规律填数'，懂得全方位尝试从而拿下附加题\"；专题 10\"数阵图推理（上/下）\"、专题 11\"排队问题：区分基数与序数，解决重叠计算易错点，建立基础位置模型\"。","explain":"【依据】S4\"难题思路：【不怕陌生题】遇到复杂'排队、规律填数'，懂得全方位尝试从而拿下附加题\"；专题 10\"数阵图推理（上/下）\"、专题 11\"排队问题：区分基数与序数，解决重叠计算易错点，建立基础位置模型\"。　B 指出了附加题的**能力价值**——不是练题型，而是练\"位置模型与推理框架\"，这与白皮书\"从会几道题走向会一类题\"的定位一致。A 的\"放弃\"与\"拿下附加题\"的目标冲突。C 窄化了受众。D 的背原题无法应对变式，也违背了奥数进阶层的初衷。","id":"UP-S4-10","bank":"up","level":"S4","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"家长说：\"乘法口诀他背得滚瓜烂熟，可一到做题就卡壳，3×5 和 5×3 还分不清。\" 按 S5，正确的底层判断是：","opts":["乘法意义和数感没建立——他不理解“几个几”的本质，只会顺着背口诀，不会双向灵活调用","孩子不用心，需要把口诀再多背几遍，背到脱口而出就不会卡壳了","孩子记忆力差，属于先天问题，换什么方法效果都有限，只能多花时间","口诀本身编得不合理，建议换一套更好记的口诀，问题就解决了"],"correct":0,"source":"S5\"家长常见误判\"中\"口诀背了半年还卡壳，就是不用心\"一栏，孩子表现\"乘法口诀顺口溜背得溜，换个顺序就不会，3×5 和 5×3 分不清楚\"，底层问题是\"乘法意义和数感没有建立，孩子不理解'几个几'的本质，只会单向顺口溜\"。","explain":"【依据】S5\"家长常见误判\"中\"口诀背了半年还卡壳，就是不用心\"一栏，孩子表现\"乘法口诀顺口溜背得溜，换个顺序就不会，3×5 和 5×3 分不清楚\"，底层问题是\"乘法意义和数感没有建立，孩子不理解'几个几'的本质，只会单向顺口溜\"。　A 把\"背得熟但不会用\"准确解释为\"意义未建立\"。B 与白皮书批评的\"加量背诵\"同类。C 用先天因素解释，既不专业也不负责。D 把教学问题推给口诀本身，方向错误。","id":"UP-S5-01","bank":"up","level":"S5","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"除法不就是乘法反过来吗？让孩子多练几道除法题不就会了？\" 按 S5，正确的是：","opts":["对，除法就是乘法的逆运算，会乘就会除，多练几道除法题自然就熟了，不用讲太多","除法比乘法难，孩子的抽象思维还没到那个程度，等大一点自然就会了","关键在数量关系模型——“平均分”与“包含除”是两种不同情境，要先分清场景再选方法","看到“分”字就用除法，这是最快的判断法，考试时能省下不少时间"],"correct":2,"source":"S5\"除法不再搞反——两种'分'彻底分清楚\"；\"家长常见误判\"中\"除法不就是乘法反过来吗\"一栏，孩子表现\"看到'分'字就用除法，经常乘除混用，平均分和包含除傻傻分不清\"，底层问题是\"数量关系模型没有搭好，'平均分'和'包含除'是两种完全不同的情境，孩子需要先区分场景再选方法\"。","explain":"【依据】S5\"除法不再搞反——两种'分'彻底分清楚\"；\"家长常见误判\"中\"除法不就是乘法反过来吗\"一栏，孩子表现\"看到'分'字就用除法，经常乘除混用，平均分和包含除傻傻分不清\"，底层问题是\"数量关系模型没有搭好，'平均分'和'包含除'是两种完全不同的情境，孩子需要先区分场景再选方法\"。　C 精准区分了两种除法情境，这是 S5 除法模块的核心。A 把\"逆运算\"当成\"同一个情境\"，正是家长误判的原话。B 用\"长大就会\"回避。D 的\"见分字就用除\"是白皮书点名的典型错误——它会让孩子把所有含\"分\"的题目都误判为除法。","id":"UP-S5-02","bank":"up","level":"S5","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"孩子做两步应用题，读完题就发呆，直接拿两个数字瞎凑一个答案。\" 按 S5，核心缺口是什么？","opts":["计算速度不够，需要练速算，算得快了就没时间发呆了，速度一上来思路自然就顺","拆解思维没建立——两步题难在“中间问题”：先求什么、结果怎么用，要拆成两问","阅读理解能力差，要多读课外书，把语文的底子补上来，数学自然就好了","题目难度超出了二年级的范围，这类题本来就不该出现在这个年级"],"correct":1,"source":"S5\"两步题不再懵——学会'先求什么 → 再求什么'\"：\"引入'中间问题法'——先把复杂问题拆成两问，分步列式、步骤写清，把脑中的混乱转成纸上的清晰。\"","explain":"【依据】S5\"两步题不再懵——学会'先求什么 → 再求什么'\"：\"引入'中间问题法'——先把复杂问题拆成两问，分步列式、步骤写清，把脑中的混乱转成纸上的清晰。\"　B 抓住了\"中间问题\"这一两步题的真难点，并给出可操作方法。A 归因到计算，答非所问。C 把数学拆解问题误判为语文阅读问题。D 否定了题目的合理性——两步题正是 S5 的核心训练目标。","id":"UP-S5-03","bank":"up","level":"S5","n":3,"kp":"A","diff":"易","levelTag":"易"},{"q":"有两道题——题 A：\"有 12 个苹果，平均分给 3 个小朋友，每人几个？\"题 B：\"有 12 个苹果，每人分 4 个，可以分给几人？\"家长问：\"这两题不都是 12÷3 吗？\" 按 S5，正确的解释与教法是：","opts":["两题方法一样，都是用总数除以份数，12÷3 一步就能解决，没必要区分那么细","题 A 用除法，题 B 用乘法，一个是分东西一个是合东西，方向不同","两题都用乘法，因为除法本来就是乘法的逆运算，本质是一回事","题 A 是“平均分”，题 B 是“包含除”，两种情境不同，要先判情境再选方法"],"correct":3,"source":"S5\"通过实物操作和图示区分'平均分'（知总数和份数求每份）和'包含除'（知总数和每份求份数），让孩子看到题先判情境再选方法\"。","explain":"【依据】S5\"通过实物操作和图示区分'平均分'（知总数和份数求每份）和'包含除'（知总数和每份求份数），让孩子看到题先判情境再选方法\"。　D 把两种情境的差别讲得准确、可操作，并点明\"先判情境\"的顺序。A 正是家长误判所在——把两种情境混为一谈。B 把题 B 归为乘法，形式上就错了（题 B 是 12÷4）。C 用\"逆运算\"掩盖了情境差异，是典型的看似有理、实则混淆。","id":"UP-S5-04","bank":"up","level":"S5","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"你们 S5 的'三个跨越'是哪三个？\" 下列哪项**不属于** S5 的\"三个跨越\"？","opts":["从加减思维到乘除思维，理解乘法意义、分清除法情境","从一步列式到分步表达，两步题能写出清晰的中间步骤","从具体数量到分数概念，建立整体与部分的份数关系","从做完就行到做完会验，养成验算自纠的习惯"],"correct":2,"source":"S5：\"从'加减思维'到'乘除思维'，从'一步列式'到'分步表达'，从'做完就行'到'做完会验'的三个跨越。\"","explain":"【依据】S5：\"从'加减思维'到'乘除思维'，从'一步列式'到'分步表达'，从'做完就行'到'做完会验'的三个跨越。\"　C 是**跨学段错位**——\"从具体数量到分数概念\"是 S6（三年级）的跨越。A、B、D 为白皮书原文。这类题反复出现在 S4、S5、S6，专门检验学员是否把各级\"跨越\"记混，是家长最容易被问到、也最容易答错的点。","id":"UP-S5-05","bank":"up","level":"S5","n":5,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子做'乘加乘减'这类混合运算总出错。\" 按 S5 课程，正确的是：","opts":["建立“先乘除后加减”的运算顺序感，通过乘加乘减两步计算题反复训练","先算加减再算乘除，从左到右依次算，跟读题的顺序保持一致最不容易错","怎么算都行，结果对就好，方法不必强求统一，孩子用得顺就行","直接教孩子用计算器，避免出错，等大一点再回头补运算顺序"],"correct":0,"source":"S5 专题 5\"乘加乘减（基础/应用）：拓展《表内乘法》。攻克乘加乘减两步计算题，建立'先乘除后加减'顺序感，杜绝期中丢分。\"","explain":"【依据】S5 专题 5\"乘加乘减（基础/应用）：拓展《表内乘法》。攻克乘加乘减两步计算题，建立'先乘除后加减'顺序感，杜绝期中丢分。\"　A 给出了正确的运算顺序与训练方式。B 顺序说反了（\"先加减后乘除\"是错的），是最典型的混淆项。C 放弃规则，会纵容错误习惯。D 绕过能力养成，与\"建立顺序感\"的目标相悖。","id":"UP-S5-06","bank":"up","level":"S5","n":6,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"孩子学'带余数的除法'，最容易错在哪？\" 白皮书强调的易错点是：","opts":["余数可以等于除数，不必纠结，只要商算对了就行","牢记“余数 ＜ 除数”，警惕“余数与除数比大小”这类易错题","余数越大越好，说明分得越充分，剩下的都是自己的","带余除法不用写余数，只写商即可，余数考试一般不扣分"],"correct":1,"source":"S5 专题 9\"带余数的除法（一/二）：对应《有余数的除法》。攻克'余数与除数比大小'易错题，牢记余数 ＜ 除数，杜绝期末失分。\"","explain":"【依据】S5 专题 9\"带余数的除法（一/二）：对应《有余数的除法》。攻克'余数与除数比大小'易错题，牢记余数 ＜ 除数，杜绝期末失分。\"　B 是白皮书点名的核心易错点。A 直接把错误规则当成规则，属于高危项。C、D 在数学上都不成立。带余除法的\"余数 ＜ 除数\"是家长问得最多的问题之一，答错会直接影响信任。","id":"UP-S5-07","bank":"up","level":"S5","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子口诀会背，但一看到'看图列式'就不知道用乘还是用除。\" 按 S5，正确做法是：","opts":["让他把口诀背得更熟一些，背到脱口而出、不用想就会，遇到题就不会再犹豫","记住口诀——有“分”字用除、有“每组”用乘，见字就能定方法","直接把答案告诉他，让他记住这类题的做法，下次照着套就行","通过实物操作（分一分、摆一摆）和图示，建立乘法意义与除法模型的对应，先判情境再选方法"],"correct":3,"source":"S5\"分一分摆一摆建模型 → 区分平均分与包含除 → 图示整理数量关系\"；\"让孩子看到题先判情境再选方法\"。","explain":"【依据】S5\"分一分摆一摆建模型 → 区分平均分与包含除 → 图示整理数量关系\"；\"让孩子看到题先判情境再选方法\"。　D 强调\"建模型 + 先判情境\"，正是解决\"看图列式\"的关键。A 继续加背诵量，没有触及意义理解。B 的\"关键词法\"看似省事，实际会把孩子训练成\"见字套符号\"，遇到变式就废。C 是给答案不给方法。","id":"UP-S5-08","bank":"up","level":"S5","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"你们总说二年级是'关键一跃'，这一跃到底重要在哪？\" 下列理解正确的是：","opts":["这一跃把乘法意义、除法模型、分步拆解同时建起来，是连接“加减地基”与“中年级应用”的桥梁","只是换了个运算符号，没那么玄，乘除和加减本质都是四则运算，会了加减乘除不难","跟高年级没什么关系，主要是为了应付二年级的期中期末考试而已","只是为了让孩子做题更快一点，速度上去了分数自然也就跟着高了"],"correct":0,"source":"S5\"它不仅连接'低年级加减地基'和'中年级复杂应用'——这一年把乘法意义和分步拆解建立起来，三年级多步应用、四五年级分数小数都会轻松很多\"。","explain":"【依据】S5\"它不仅连接'低年级加减地基'和'中年级复杂应用'——这一年把乘法意义和分步拆解建立起来，三年级多步应用、四五年级分数小数都会轻松很多\"。　A 讲清了 S5 的**承上启下**价值，这也是向家长解释\"为什么必须在这一年打牢\"最有力的说法。B、D 矮化了学段价值。C 割裂了与高年级的联系，与白皮书\"核心桥梁\"的定位相冲突。","id":"UP-S5-09","bank":"up","level":"S5","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子总说做完就不想检查了，怎么破？\" 按 S5 的 UPSC 习惯闭环，正确引导是：","opts":["检查是浪费时间，做完直接交就好，省下来的时间多刷两道题更划算","只有大考才需要检查，平时作业不用检查，免得养成依赖的习惯，反而拖慢速度","把“验证自检”变成习惯——做完回头检查条件、过程和结果，这是降粗心率的关键","让家长帮孩子检查，省时间也更准，孩子负责做题、家长负责把关"],"correct":2,"source":"S5\"打造终生受益的满分习惯：UPSC 核心解题法\"——Check 复盘检查；\"把'不粗心'变成肌肉记忆\"。","explain":"【依据】S5\"打造终生受益的满分习惯：UPSC 核心解题法\"——Check 复盘检查；\"把'不粗心'变成肌肉记忆\"。　C 把检查定位为**习惯而非补救**，与白皮书\"肌肉记忆\"的表述一致。A 否定检查价值。B 人为区分平时与大考，而习惯恰恰靠平时养成。D 让家长代劳，孩子永远建立不了自检能力，也与 S5\"做完题习惯性检查，丢分变少\"的成效目标冲突。","id":"UP-S5-10","bank":"up","level":"S5","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"家长焦虑：\"孩子三年级突然就跟不上了，是不是态度出了问题？\" 按 S6，根本原因是：","opts":["是态度问题，需要加强管教和督促，先把学习习惯抓起来，态度端正了成绩自然跟着上","是老师教学水平的问题，换一个更适合孩子风格的老师就能明显改善","是孩子智力发展的问题，需要先做个专业测评看看真实水平再定","三年级是分水岭——分数登场、乘除变日常、应用题跃到三四步，要的是思维工具升级"],"correct":3,"source":"S6 开篇：\"很多孩子在这个阶段出现明显的成绩波动，家长归结为'孩子不认真'，但根源在于知识体系和思维方式的全面升级。孩子需要的不是更多刷题，而是系统性的思维工具升级。\"","explain":"【依据】S6 开篇：\"很多孩子在这个阶段出现明显的成绩波动，家长归结为'孩子不认真'，但根源在于知识体系和思维方式的全面升级。孩子需要的不是更多刷题，而是系统性的思维工具升级。\"　D 直引白皮书开篇判断，是回应\"突然跟不上\"的标准答案。A 停留在态度层面，看不到能力升级的真实需求。B 甩锅给师资。C 越界下智力判断。三者都无法给家长提供有价值的方案。","id":"UP-S6-01","bank":"up","level":"S6","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"分数不就是上下两个数嘛，画个图孩子看看就懂了。\" 按 S6，正确的是：","opts":["分数就是符号操作，会算就行，不必深究含义，考试考的是计算不是概念","分数“份数”意义没建立——分子分母搞反、比大小靠猜，要用实物分份和图示建“整体与部分”","分数是初中才需要深入的内容，三年级没必要理解太深，认识符号、会读会写就够了","把分数的几个口诀背下来就能应付，考试的题型就那几种，记住了就够用"],"correct":1,"source":"S6\"分数不再'靠猜'——从'上下两个数'到'份数关系'\"；\"家长常见误判\"中\"分数就是上下两个数\"一栏，底层问题是\"分数'份数'意义没建立，孩子不理解整体与部分的关系，只会按表面数字操作\"。","explain":"【依据】S6\"分数不再'靠猜'——从'上下两个数'到'份数关系'\"；\"家长常见误判\"中\"分数就是上下两个数\"一栏，底层问题是\"分数'份数'意义没建立，孩子不理解整体与部分的关系，只会按表面数字操作\"。　B 准确指出\"份数意义\"才是分数的地基，并给出\"实物分份 + 图示\"的建立方式。A、D 都把分数降级为符号与口诀，正是白皮书要突破的\"符号空转\"。C 把该学的内容推给初中，是学段错位。","id":"UP-S6-02","bank":"up","level":"S6","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"多位数乘除就是算得慢，多练练就好了吧？\" 按 S6，正确的判断是：","opts":["算到一半就乱、竖式缺位漏位，本质是算理不清加上缺巧算策略，只会套竖式","对，多练就能提速，熟练度上来了，速度和正确率都会跟着上去，量变引起质变","是孩子手写得慢，不是数学问题，平时多练练书写速度就能改善","用计算器可以绕开这个问题，先用工具把正确率保住再说"],"correct":0,"source":"S6\"多位数乘除不再崩——从'硬算'到'巧算'\"；\"家长常见误判\"中\"多位数乘除就是算得慢\"一栏，底层问题是\"算理不清 + 巧算策略缺失，只会机械套竖式，不懂位值和运算律的灵活运用\"。","explain":"【依据】S6\"多位数乘除不再崩——从'硬算'到'巧算'\"；\"家长常见误判\"中\"多位数乘除就是算得慢\"一栏，底层问题是\"算理不清 + 巧算策略缺失，只会机械套竖式，不懂位值和运算律的灵活运用\"。　A 把\"算得慢\"翻译成\"算理与策略\"问题，并指向位值感与巧算策略（凑整、拆分、运算律）。B 与\"减少机械刷题依赖\"的思路相悖。C 归因到书写速度，偏离数学本身。D 用工具替代能力，孩子永远补不上多位数乘除的算理。","id":"UP-S6-03","bank":"up","level":"S6","n":3,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"三年级的应用题，多读两遍不就想出来了吗？\" 按 S6，正确的是：","opts":["对，多读几遍自然就能想出来，题读熟了关系就理清了，理解能力是关键","多步题只要列成一个综合算式就行，步骤写多了反而容易出错","三四步题难在“中间问题链”——先求什么、怎么连，光多读不够，要用“中间问题法”拆解","多步题太难，可以先放弃，把两步题做稳就够应付考试了，性价比更高"],"correct":2,"source":"S6\"多步题不再空——学会'问题链拆解法'\"：\"引入'中间问题链'——先求什么 → 已知什么 → 怎么连起来，把三四步大题拆成可解的小步。\"","explain":"【依据】S6\"多步题不再空——学会'问题链拆解法'\"：\"引入'中间问题链'——先求什么 → 已知什么 → 怎么连起来，把三四步大题拆成可解的小步。\"　C 说清了多步题的真难点与解法。A 是家长的典型乐观误判，也是白皮书要求纠正的\"读题不清导致的结构误判\"。B 只求形式（综合算式），没有解决\"从哪一步开始想\"的问题。D 用放弃回避——多步题正是 S6 的核心训练目标。","id":"UP-S6-04","bank":"up","level":"S6","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"你们 S6 的'三个跨越'是哪三个？\" 下列哪项**不属于** S6 的\"三个跨越\"？","opts":["从具体数量到分数概念，建立整体与部分的份数关系","从算术思维到代数思维，学会设未知数、列方程","从直来直往到多步策略，会用中间问题法拆复杂题","从算出答案到讲清逻辑，能说出每一步为什么这样算"],"correct":1,"source":"S6：\"从'具体数量'到'分数概念'，从'直来直往'到'多步策略'，从'算出答案'到'讲清逻辑'的三个跨越。\"","explain":"【依据】S6：\"从'具体数量'到'分数概念'，从'直来直往'到'多步策略'，从'算出答案'到'讲清逻辑'的三个跨越。\"　B 是 S8（五年级）的跨越。A、C、D 为白皮书原文。此题与 S4、S5 的同类题构成一组，反复校准学员对\"各级跨越\"的记忆，是家长追问时最容易露怯的知识点。","id":"UP-S6-05","bank":"up","level":"S6","n":5,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子做'鸡兔同笼'这类题完全没有思路。\" 按 S6 暑期课程，正确的训练方向是：","opts":["直接背公式，考试遇到就套，这类题的题型就那几种，套对了就能得分，最省时间","这类题太难，可以先跳过，把基础题做稳，难题等能力够了以后再说","只有走奥数路线的孩子才需要学，普通孩子不必在这上面花时间精力","通过假设法与列表法建“先假设再调整”的思维模型，让他理解策略过程，而不是背结果"],"correct":3,"source":"S6 暑期\"鸡兔同笼与倒水问题：攻克假设法与列表法经典策略题型，建'先假设再调整'思维模型\"；\"难题思路：【鸡兔同笼不求人】学会假设法、列表法等经典策略，面对经典数学趣题有方法有步骤\"。","explain":"【依据】S6 暑期\"鸡兔同笼与倒水问题：攻克假设法与列表法经典策略题型，建'先假设再调整'思维模型\"；\"难题思路：【鸡兔同笼不求人】学会假设法、列表法等经典策略，面对经典数学趣题有方法有步骤\"。　D 抓住了策略类的训练本质——建模型、懂过程。A 的背公式在题型稍变时就会失效，与\"有方法有步骤\"的目标冲突。B 用跳过回避，而鸡兔同笼正是 S6 难题思路的代表模块。C 窄化了受众。","id":"UP-S6-06","bank":"up","level":"S6","n":6,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"三年级学分数，是不是就要会算异分母加减了？\" 按 S6 的\"分数的认识\"，正确的是：","opts":["是的，三年级要掌握异分母分数加减，一步到位省得以后再学，省下的时间练别的","三年级只要会写分数符号就够了，含义不用讲太深，孩子也听不懂","三年级重点是建立“整体与部分”的份数关系，攻克份数判断与同分母加减；异分母和乘法属更高学段","三年级要把通分约分的所有技巧都学会，为五年级的分数运算打好基础"],"correct":2,"source":"S6 专题 7\"分数的认识与简单计算：对应《分数的初步认识》。攻克份数判断与同分母加减题，建'整体与部分'关系\"；S8 专题 10 才涉及异分母加减与裂项巧算。","explain":"【依据】S6 专题 7\"分数的认识与简单计算：对应《分数的初步认识》。攻克份数判断与同分母加减题，建'整体与部分'关系\"；S8 专题 10 才涉及异分母加减与裂项巧算。　C 划清了 S6 与 S8 的分数边界——S6 建\"份数意义 + 同分母\"，S8 才上\"异分母 + 巧算\"。A、D 把 S8 的内容前移到 S6，属学段错位。B 又把要求压得过低，忽略了 S6 明确的同分母加减与比大小。","id":"UP-S6-07","bank":"up","level":"S6","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"'容斥原理''周期问题'这些拓展内容，孩子有必要学吗？又不一定考。\" 按 S6 的三层知识体系（校内提前 / 思维拓展 / 奥数进阶），最合理的解释是：","opts":["这属于思维拓展层——目的是建集合、周期等思维工具，让“会算”变“会策略”","没必要学，浪费时间，把校内的基础内容学扎实比什么都重要，拓展等以后再说","只要学校考试考到的才需要学，不考的题目学了也没有什么用处可言","学了能立刻提分，所以必须学，投入和回报一定是成正比关系的"],"correct":0,"source":"S6\"三层知识体系\"中\"🧠 思维拓展（拉距）：跳出死记硬背，掌握方法技巧\"与\"🏅 奥数进阶（牛娃）：直击竞赛高频压轴题，培养抗挫力与抽象逻辑\"；\"把'会算'升级为'会策略'\"。","explain":"【依据】S6\"三层知识体系\"中\"🧠 思维拓展（拉距）：跳出死记硬背，掌握方法技巧\"与\"🏅 奥数进阶（牛娃）：直击竞赛高频压轴题，培养抗挫力与抽象逻辑\"；\"把'会算'升级为'会策略'\"。　A 准确解释了拓展层的作用——练的是**思维工具**，不是记解法，这正好回应了\"不一定考\"的质疑。B 否定拓展价值。C 用\"考不考\"做唯一标准，忽略了思维工具的迁移价值。D 承诺\"立刻提分\"，是不负责任的过度承诺。","id":"UP-S6-08","bank":"up","level":"S6","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"三年级学的分数和多步拆解，对高年级有什么用？\" 下列理解正确的是：","opts":["只在三年级有用，过了就忘，后面的内容和它关系不大，不必花太多力气","分数概念和多步策略直接决定四五年级能否保持优势，四年级小数、五年级方程都建在这地基上","与初中数学没有关系，初中会把这部分重新学一遍，小学学没学影响不大","主要是为了应付三年级的考试，考完这一段就翻篇了，不用太纠结掌握程度"],"correct":1,"source":"S6\"分数概念和多步应用题的掌握程度，将直接决定四五年级能否持续保持优势，也是小升初拔高的必备地基\"。","explain":"【依据】S6\"分数概念和多步应用题的掌握程度，将直接决定四五年级能否持续保持优势，也是小升初拔高的必备地基\"。　B 沿着白皮书的\"放眼小学六年\"逻辑，把 S6 放进完整链路里解释，这对缓解家长的短期焦虑最有效。A、D 都只看眼前。C 割裂了小学与初中的衔接，与\"分水岭决定后续高度\"的判断相冲突。","id":"UP-S6-09","bank":"up","level":"S6","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子一遇三四步的应用题就空着，或者只做完第一步就停了。\" 按 S6 的\"中间问题链\"，最合适的引导是：","opts":["告诉孩子太难了，先做一步题，等他能力够了再回来挑战多步题，不要硬逼","让孩子直接列成一个综合算式，一步到位，避免步骤太多写错漏错","把参考答案抄下来背熟，考试遇到类似的题照着写就能拿到分","教他用“先求什么、怎么连”把大题拆成小步，配合画图理关系与分步列式，把步骤链写完整"],"correct":3,"source":"S6\"中间问题法 → 画图理关系 → 规范分步列式\"；\"孩子出现的变化：多步应用题能写出清晰步骤链\"。","explain":"【依据】S6\"中间问题法 → 画图理关系 → 规范分步列式\"；\"孩子出现的变化：多步应用题能写出清晰步骤链\"。　D 完整给出拆解路径，并强调\"步骤链\"这一可检验的成果。A 用降难度回避。B 只追求形式，孩子仍然不知道从哪一步入手。C 的背答案在变式面前立刻失效，也无法建立步骤链意识。","id":"UP-S6-10","bank":"up","level":"S6","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"家长说：\"孩子四年级，读得懂题但列不出式，我让他多刷题也没用。\" 按 S7，根本原因是：","opts":["孩子不够努力，需要加大练习量，练得多了手感就来了，思路自然也就打开了","思维方式要从“直觉型”升级为“建模型”——四年级是抽象思维转折点，缺的是画图建模能力","题目太难，已经超出了孩子目前的水平，先放缓进度让他慢慢适应","孩子语文功底差，读不懂题意，要先补阅读理解，再回头说数学"],"correct":1,"source":"S7 开篇：\"很多孩子在这里出现'读得懂题但列不出式'的困境，家长们焦虑地发现——刷题已经不管用了。其实问题的本质不是不努力，而是思维方式需要从'直觉型'升级为'建模型'。\"","explain":"【依据】S7 开篇：\"很多孩子在这里出现'读得懂题但列不出式'的困境，家长们焦虑地发现——刷题已经不管用了。其实问题的本质不是不努力，而是思维方式需要从'直觉型'升级为'建模型'。\"　B 直引白皮书判断，把\"列不出式\"归因到\"缺建模思维\"，并点明刷题无效的原因。A 继续加量，正是白皮书否定的做法。C 用\"超纲\"回避。D 误判为语文问题——白皮书讲的是\"不会把文字描述转化为标准模型\"，属数学建模能力，不是阅读能力。","id":"UP-S7-01","bank":"up","level":"S7","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"大数不就是多几个零嘛，有什么好学的？\" 按 S7，正确的是：","opts":["大数读写多零少零、四舍五入乱用，本质是位值概念没结构化，要用“数级分层法”分步处理","对，多写几个零就行，没什么难度，只要细心一点基本就不会出错，属于粗心问题","大数不重要，会读就行，实际生活里也用不上，考试占比也不大","大数只要背下数位顺序表就可以，背熟了照着填空就能做对"],"correct":0,"source":"S7\"大数不再'多零少零'——建立数级分层思维\"；\"家长常见误判\"中\"大数不就是多几个零\"一栏，底层问题是\"位值概念没有结构化，孩子不理解'数级'和'数位'的分层逻辑，只会机械套规则\"。","explain":"【依据】S7\"大数不再'多零少零'——建立数级分层思维\"；\"家长常见误判\"中\"大数不就是多几个零\"一栏，底层问题是\"位值概念没有结构化，孩子不理解'数级'和'数位'的分层逻辑，只会机械套规则\"。　A 给出\"数级分层法\"这一结构化方法，正是白皮书主张的。B 是家长误判原话。C 用工具替代能力，忽略了位值感是后续四舍五入、单位换算的基础。D 只要求背数位表，属于机械记忆，解决不了\"多零少零\"。","id":"UP-S7-02","bank":"up","level":"S7","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长问：\"相遇问题我是让孩子直接套'相遇时间 = 路程 ÷ 速度和'的公式，这样效率高，对吗？\" 下列哪种做法**最符合** S7 的导向？","opts":["对，直接套公式效率最高，不必画图，画图反而浪费时间，公式熟了直接代入就行","把所有行程公式都背下来，考试时挨个试一遍，总能试对一道题","先画标准线段图、标起点和方向、找等量关系再列式，把文字转成行程模型","行程题太难，可以先跳过，把计算和应用题做稳就够应付考试了"],"correct":2,"source":"S7\"行程不再'盲猜'——建立线段图建模思维\"：\"相遇追及先画标准线段图 → 标起点标方向 → 找等量关系 → 列式求解。让抽象行程变得可视化\"；\"家长常见误判\"中\"相遇问题多读几遍画个图\"一栏，底层问题是\"等量关系提取能力没建立，不会把文字描述转化为'路程 = 速度 × 时间'的标准模型\"。","explain":"【依据】S7\"行程不再'盲猜'——建立线段图建模思维\"：\"相遇追及先画标准线段图 → 标起点标方向 → 找等量关系 → 列式求解。让抽象行程变得可视化\"；\"家长常见误判\"中\"相遇问题多读几遍画个图\"一栏，底层问题是\"等量关系提取能力没建立，不会把文字描述转化为'路程 = 速度 × 时间'的标准模型\"。　C 完整呈现白皮书的建模流程。A 正是白皮书批评的\"模板生搬硬套\"——条件一变（如追及、往返）就失效。B 背公式逐个试，与\"找等量关系\"的思路背道而驰。D 放弃——相遇追及是 S7 的核心模块。","id":"UP-S7-03","bank":"up","level":"S7","n":3,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"小数不就是加个小数点吗？孩子怎么老点错位？\" 按 S7，正确的是：","opts":["对，会数小数点就行，点错了是细心问题，多提醒几次、多练几遍就好了","小数是初中才需要深入的内容，小学阶段不用深究，认识、会读写就够","小学只学小数加减，不涉及乘除，乘除等内容等初中再学也来得及","小数乘除常点错、运算律不会迁移，本质是位值逻辑没打通，要建“小数点移动 = 位值变化”的理解"],"correct":3,"source":"S7\"小数不再'点错位'——打通位值逻辑链\"：\"从小数意义到小数加减 → 乘除，帮孩子建立'小数点移动 = 位值变化'的统一理解，运算律自然迁移\"；\"家长常见误判\"中\"小数不就是加个小数点\"一栏，底层问题是\"小数运算的位值逻辑没打通，停留在'背规则'而非'理解为什么'\"。","explain":"【依据】S7\"小数不再'点错位'——打通位值逻辑链\"：\"从小数意义到小数加减 → 乘除，帮孩子建立'小数点移动 = 位值变化'的统一理解，运算律自然迁移\"；\"家长常见误判\"中\"小数不就是加个小数点\"一栏，底层问题是\"小数运算的位值逻辑没打通，停留在'背规则'而非'理解为什么'\"。　D 给出了位值逻辑这一根本解法，并强调运算律迁移（整数运算律平滑移到小数）。A 把系统性问题当成\"细心\"问题，是家长最典型的轻描淡写。B、C 都低估或缩小了小学小数的学习范围——白皮书把小数乘除列为 S7 的重要升级内容。","id":"UP-S7-04","bank":"up","level":"S7","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"你们 S7 的'三个跨越'是哪三个？\" 下列哪项**不属于** S7 的\"三个跨越\"？","opts":["从“算术型”到“代数型”，学会设未知数、找等量关系、列方程","从“看题就猜”到“画图建模”，遇到复杂题先画图再下笔","从“单步直算”到“多步策略”，会拆中间问题、分步求解","从“做了就行”到“做了必对”，用完整流程把正确率稳住"],"correct":0,"source":"S7：\"从'看题就猜'到'画图建模'，从'单步直算'到'多步策略'，从'做了就行'到'做了必对'的三个跨越。\"","explain":"【依据】S7：\"从'看题就猜'到'画图建模'，从'单步直算'到'多步策略'，从'做了就行'到'做了必对'的三个跨越。\"　A 是 S8（五年级）的思维转向。B、C、D 为白皮书原文。这组\"三个跨越\"辨析题从 S4 贯穿到 S9，是检验学员学段知识是否成体系的高频考点。","id":"UP-S7-05","bank":"up","level":"S7","n":5,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"平行四边形、三角形、梯形的面积公式我都让孩子背熟了，可题目一变他就懵。\" 按 S7，正确的判断是：","opts":["公式背得还不够熟，继续反复背，背到条件一变也能马上反应过来就不怕了","面积公式“不是背的，是能推导出来的”——要让孩子经历割补转化的推导过程，才能举一反三","只要把公式背熟就足够了，考试考的是代入计算，并不考推导过程","只做标准图形题，变式题可以不练，把标准题的分稳稳拿住最实在"],"correct":1,"source":"S7\"难题思路：【面积会推导】平行四边形三角形梯形面积公式不是背的，是能推导出来的，举一反三\"；专题 9\"攻克面积推导与高线判断易错题，建'割补转化'推导力\"。","explain":"【依据】S7\"难题思路：【面积会推导】平行四边形三角形梯形面积公式不是背的，是能推导出来的，举一反三\"；专题 9\"攻克面积推导与高线判断易错题，建'割补转化'推导力\"。　B 直引白皮书\"不是背的，是能推导的\"，并点出\"割补转化\"这一推导工具。A 继续加背诵量，无法解决\"一变就懵\"。C 与白皮书表述正面冲突。D 用回避替代——变式题恰恰检验推导理解，是 S7\"举一反三\"的核心。","id":"UP-S7-06","bank":"up","level":"S7","n":6,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"三角形内角和，直接让孩子背'180°'不就行了？\" S7 白皮书强调的是：","opts":["直接背结论“三角形内角和是 180°”，考试能用就行，推导过程不必深究","只记结论、不解释也可以，孩子把结论记住、会做题就够了","这属于超纲内容，不必深入讲解，等小学高年级再系统讲也不迟","用“动手拼”理解角度规律，攻克三边关系与内角和推导题，建几何推理链"],"correct":3,"source":"S7 专题 6\"三角形与多边形内角和：攻克三边关系判断与内角和推导题，用'动手拼'理解角度规律\"；\"推导更准：内角和与三边关系能推导，不背公式\"。","explain":"【依据】S7 专题 6\"三角形与多边形内角和：攻克三边关系判断与内角和推导题，用'动手拼'理解角度规律\"；\"推导更准：内角和与三边关系能推导，不背公式\"。　D 与白皮书\"不背公式、动手拼理解\"的表述一致，且把它接到\"几何推理链\"上。A、B 都把结论与推导割裂，是 S7 明确反对的做法。C 与\"攻克内角和推导题\"的模块目标冲突。","id":"UP-S7-07","bank":"up","level":"S7","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"我们家孩子会做但总做错，老师说是跳步惹的祸，怎么改？\" 按 S7 的建模标准化 SOP，正确引导是：","opts":["要求孩子再快一点，多练就能减少错误，熟练度是根本，练到条件反射就不错了","出错就罚抄十遍让他长记性，惩罚到位了他就不敢再马虎大意了","养成“读题画图 → 找等量关系 → 列式 → 验证”的流程，把“会做”变“做了必对”","检查是浪费时间，做完直接交卷，靠平时的熟练度来保证正确率"],"correct":2,"source":"S7\"学霸习惯：【建模标准化】养成 SOP：读题画图 → 标位置标方向 → 找等量关系 → 规范列式 → 代入验证\"。","explain":"【依据】S7\"学霸习惯：【建模标准化】养成 SOP：读题画图 → 标位置标方向 → 找等量关系 → 规范列式 → 代入验证\"。　C 与白皮书 SOP 完全一致，用**流程**解决\"会做但做错\"，这也是\"做了必对\"这一跨越的落地方式。A 只加速不补流程，错误率不会下降。B 用惩罚替代方法。D 否定验证环节，与 SOP 第五步直接冲突。","id":"UP-S7-08","bank":"up","level":"S7","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"四年级学的行程模型、面积推导，对高年级到底有什么价值？\" 下列理解正确的是：","opts":["只在四年级用，之后用不上，后面学的都是新模型，不必花太多精力在衔接上","与初中数学没有关系，初中几何是另起的一套体系，衔接不上","直接决定五六年级几何压轴和分数复杂运算能否顺滑衔接，是通向高年级的桥梁","只是为了应付四年级的考试，考完这段内容就翻篇了，不必在意"],"correct":2,"source":"S7\"这一年建立的行程模型、面积推导和运算策略，将直接决定五、六年级的几何压轴和分数复杂运算能否顺滑衔接\"。","explain":"【依据】S7\"这一年建立的行程模型、面积推导和运算策略，将直接决定五、六年级的几何压轴和分数复杂运算能否顺滑衔接\"。　C 沿白皮书\"放眼小学六年\"的逻辑，把 S7 定位成中年级收官与高年级桥梁。A、D 只看当下。B 割裂初高衔接，忽略了行程建模（方程思想的前身）与面积推导（几何推理链）的长期价值。","id":"UP-S7-09","bank":"up","level":"S7","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子做'和差倍问题'总是混淆，怎么教都不清楚。\" 按 S7，最合适的方法是：","opts":["用线段图建模，把复杂数量关系可视化，再处理多层倍数问题，建“从倍推量”的逆向思维","把“（和 + 差）÷ 2 = 大数”这类公式全都背下来，遇到题直接套用","这类题多做几遍就会熟，不用特意讲方法，做多了自然就有感觉","题型太绕可以先放弃，把行程和几何这两块的分数先稳稳拿住再说"],"correct":0,"source":"S7 专题 12\"和差倍问题进阶：攻克和差倍变式与'倍倍'奥数问题，用线段图建模破复杂数量关系\"；\"倍倍与组合问题：建立'从倍推量'的逆向数量思维\"。","explain":"【依据】S7 专题 12\"和差倍问题进阶：攻克和差倍变式与'倍倍'奥数问题，用线段图建模破复杂数量关系\"；\"倍倍与组合问题：建立'从倍推量'的逆向数量思维\"。　A 落到\"线段图建模\"这一 S7 的核心工具，并指出多层倍数要建立逆向数量思维。B 背公式只能应对标准题型，稍变就乱。C 靠\"多做\"而无方法，与 S7\"用方法代替硬猜\"的取向相悖。D 放弃——和差倍是行程之外的另一条重要数量关系线。","id":"UP-S7-10","bank":"up","level":"S7","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"家长说：\"分数的约分通分，多练练不就好了？\" 按 S8，正确的判断是：","opts":["对，多练自然就熟，约分通分就是熟练度问题，练到位了就不会再错，不用讲道理","分数太难，长大一点自然会懂，现在不必死磕，先放着以后再说","约分不彻底、通分找错公倍数，本质是“因倍质合”没打透——分数运算的核心在因倍关系","可以用计算器绕开约分和通分，先用工具把正确率保住再说别的"],"correct":2,"source":"S8\"分数不再'算崩'——打通因倍质合的底层逻辑\"；\"家长常见误判\"中\"分数的约分通分多练就好了\"一栏，底层问题是\"因倍质合基础没打透，分数运算的核心在因倍关系\"。","explain":"【依据】S8\"分数不再'算崩'——打通因倍质合的底层逻辑\"；\"家长常见误判\"中\"分数的约分通分多练就好了\"一栏，底层问题是\"因倍质合基础没打透，分数运算的核心在因倍关系\"。　C 把\"算错约分通分\"上溯到\"因倍质合\"，这正是 S8 的主张——先打数论地基，再上分数运算。A 与\"打破机械背规则\"冲突。B 用\"长大就会\"回避。D 用工具替代能力，约分通分背后是对因数倍数的理解，工具无法替代。","id":"UP-S8-01","bank":"up","level":"S8","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"方程不就是 x 代替问号，换个写法而已嘛。\" 按 S8，正确的是：","opts":["对，就是换了个符号而已，把问号换成 x，写法更规范，其他都和算术一样","方程不用太早学，算术方法就够了，算术想得通就不必用方程","只要会解方程就行，会不会设无所谓，能把解求出来才是关键","设不来未知数、等量关系找不准、解完不检验，本质是代数建模思维没建立起来"],"correct":3,"source":"S8\"方程不再'设不来'——建立代数建模标准化流程\"；\"家长常见误判\"中\"方程就是 x 代替问号换个写法\"一栏，底层问题是\"代数建模思维没建立，不会把文字关系转化为等式，无法从算术跨越到代数\"。","explain":"【依据】S8\"方程不再'设不来'——建立代数建模标准化流程\"；\"家长常见误判\"中\"方程就是 x 代替问号换个写法\"一栏，底层问题是\"代数建模思维没建立，不会把文字关系转化为等式，无法从算术跨越到代数\"。　D 点出方程的实质是\"把文字关系转化为等式\"的建模能力，而非符号替换。A 正是家长误判原话。B 否定了方程作为初中代数地基的地位。C 只重\"解\"不重\"设\"，而\"设未知数 + 找等量关系\"恰恰是代数建模的关键，白皮书把它列为完整闭环（设 → 列 → 解 → 验）。","id":"UP-S8-02","bank":"up","level":"S8","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"面积公式背熟、套进去不就行了？\" 按 S8，正确的是：","opts":["对，背公式最省事，标准图形直接代入就行，考试主要考的就是这些，不必多花功夫","面积推导和策略迁移没掌握——要理解公式从哪来，并建立“看题选策略”的能力","面积题只能靠灵感，没有方法可言，题目见得多了自然就会做","只学标准图形的面积就够了，不规则图形在考试里占比很小"],"correct":1,"source":"S8\"面积不再'套路化'——建立灵活策略思维\"；\"家长常见误判\"中\"面积公式背熟套进去就行\"一栏，底层问题是\"面积推导和策略迁移没掌握，只会背公式，不理解公式从哪来的，更不会灵活组合策略\"。","explain":"【依据】S8\"面积不再'套路化'——建立灵活策略思维\"；\"家长常见误判\"中\"面积公式背熟套进去就行\"一栏，底层问题是\"面积推导和策略迁移没掌握，只会背公式，不理解公式从哪来的，更不会灵活组合策略\"。　B 指出两个方向——理解推导来源 + 建立策略选择能力，与白皮书\"先理解每种策略的适用场景，再通过变式训练建立'看题选策略'\"完全一致。A、D 都停在标准图形。C 用\"靠灵感\"消解方法，与\"策略思维\"的课程定位冲突。","id":"UP-S8-03","bank":"up","level":"S8","n":3,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长问：\"你们 S8 的'三个跨越'是哪三个？\" 下列哪项**不属于** S8 的\"三个跨越\"？","opts":["从“会做单章题”到“会解综合题”，能跨模块拆解综合应用","从“按步骤套”到“理解推导”，明白公式和步骤从哪来","从“算术直算”到“代数建模”，会设未知数、列方程","从“会做熟题”到“会解新题”，陌生题型也有思路"],"correct":0,"source":"S8：\"从'按步骤套'到'理解推导'，从'算术直算'到'代数建模'，从'会做熟题'到'会解新题'的三个跨越。\"","explain":"【依据】S8：\"从'按步骤套'到'理解推导'，从'算术直算'到'代数建模'，从'会做熟题'到'会解新题'的三个跨越。\"　A 是 S9（六年级）的跨越。B、C、D 为白皮书原文。这组辨析题是 S4→S9 的固定考法，专治\"跨级记忆混乱\"。","id":"UP-S8-04","bank":"up","level":"S8","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子解方程总忘记检验，重要吗？\" 按 S8 的\"代数规范化\"SOP，正确的是：","opts":["检验不重要，可以省略，解出来答案对了就行，写检验步骤反而浪费时间","只有大题才需要检验，小题口算就能判断对错，不必每题都走一遍流程","养成“读题 → 建模 → 设未知数 → 求解 → 检验”的完整闭环，检验是必备一步","让老师或家长代为检查就好，孩子负责解题，大人负责最后把关"],"correct":2,"source":"S8\"学霸习惯：【代数规范化】养成 SOP：读题 → 画图建模 → 设未知数列方程 → 规范求解 → 代入检验\"；\"方程设解检验完整闭环不跳步\"。","explain":"【依据】S8\"学霸习惯：【代数规范化】养成 SOP：读题 → 画图建模 → 设未知数列方程 → 规范求解 → 代入检验\"；\"方程设解检验完整闭环不跳步\"。　C 与白皮书 SOP 一致，把检验确立为闭环的必需一步。A 直接删除关键环节。B 人为区分题量大小，而检验是习惯。D 让他人代劳，孩子无法内化\"检验\"意识，与\"完整闭环不跳步\"的目标冲突。","id":"UP-S8-05","bank":"up","level":"S8","n":5,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子做'火车相遇''火车追及'总错，是不是这类题太难了？\" 按 S8，正确的思路是：","opts":["太难了，可以先放弃，这部分考试占比不大，性价比不高，把会做的分拿稳更实际","直接背“相遇时间 = 路程 ÷ 速度和”，代入数字就能出结果","只做最简单的行程题，复杂的等以后能力够了再去碰它","火车行程有特殊性——车有“车身长度”，要建特殊行程模型，再用方程法统一建模"],"correct":3,"source":"S8 专题 12\"火车相遇与追及：突破《行程问题》专题。攻克火车与人、火车与火车相追题，建'车身长度'特殊行程模型\"；\"行程综合建模：攻克多对象多阶段复杂行程题，用方程法统一建模\"。","explain":"【依据】S8 专题 12\"火车相遇与追及：突破《行程问题》专题。攻克火车与人、火车与火车相追题，建'车身长度'特殊行程模型\"；\"行程综合建模：攻克多对象多阶段复杂行程题，用方程法统一建模\"。　D 指出了火车行程题的**特殊性**（车身长度）与**统一解法**（方程建模），这是白皮书明确的进阶方向。A、C 用回避取代学习，而火车相遇正是 S8 的模块内容。B 把 S7 的基础公式简单照搬，忽略了车身长度带来的变量，正是\"套模板失效\"的典型。","id":"UP-S8-06","bank":"up","level":"S8","n":6,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"五年级'因倍质合'这一块，最核心要掌握什么？\" 正确的是：","opts":["建立完整数论基础——质数合数判断、公因公倍计算、整除判据，为分数运算打底","只要会背质数表就够了，考试考的就是判断质数合数，背熟了就能拿分","只要能做大数乘法就行，计算才是这一块最核心的能力","这一块不太重要，可以直接跳过去，考试里基本不会考到"],"correct":0,"source":"S8 专题 7\"因倍质合全模块：攻克质数合数判断与公因公倍计算题，建完整数论基础体系\"；专题 5\"整除特征与复合判据：建'单条件 → 复合条件'递进判断力\"。","explain":"【依据】S8 专题 7\"因倍质合全模块：攻克质数合数判断与公因公倍计算题，建完整数论基础体系\"；专题 5\"整除特征与复合判据：建'单条件 → 复合条件'递进判断力\"。　A 说清了因倍质合作为\"分数运算地基\"的定位，与 S8\"先把质因数分解和公因公倍等数论地基打透\"的思路一致。B 只要求背质数表，属机械记忆，无法支撑约分通分。C 与因倍质合无关。D 直接跳过地基，后续分数运算必然反复出问题。","id":"UP-S8-07","bank":"up","level":"S8","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子分数异分母加减总出错，是不是得先把整数运算整个复习一遍？\" 按 S8，最关键的判断是：","opts":["对，必须整体回退复习整数，把整数运算彻底练熟以后再回来学分数，地基不牢一切都白搭","分数运算的地基是“因倍质合”——补透质因数分解、公因公倍，再衔接约分通分","分数和整数没有关系，复习整数没用，重点还是放在分数上多练","分数靠多练就行，不用补什么基础，练多了自然就熟练起来了"],"correct":1,"source":"S8\"先把质因数分解和公因公倍等数论地基打透，再衔接约分通分和分数加减，让每一步都有据可循\"。","explain":"【依据】S8\"先把质因数分解和公因公倍等数论地基打透，再衔接约分通分和分数加减，让每一步都有据可循\"。　B 精准定位到\"因倍质合\"这个真正的缺口，避免让孩子做整体回退的无用功。A 用\"整个复习一遍\"制造大工程，效率低且治不到点。C 割裂分数与整数的关系（约分通分本质就是因倍关系）。D 与\"打破机械背规则\"冲突，多练治不了地基问题。","id":"UP-S8-08","bank":"up","level":"S8","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"五年级的分数和方程，对以后有多大影响？\" 下列理解正确的是：","opts":["只在五年级用，之后少见，初中基本不再单独考分数运算，不必太焦虑","与初中代数没有关系，初中代数是从全新的内容开始学起的","主要是为了应付五年级的考试，考完这一块内容就翻篇了","分数和方程是整个初中代数的地基，扎不扎实直接决定六年级冲刺的高度"],"correct":3,"source":"S8\"分数和方程作为整个初中代数的地基，这一年掌握得是否扎实，直接决定六年级综合冲刺的高度和小升初的竞争力\"。","explain":"【依据】S8\"分数和方程作为整个初中代数的地基，这一年掌握得是否扎实，直接决定六年级综合冲刺的高度和小升初的竞争力\"。　D 直引白皮书，把 S8 的价值放到初中与升学的高度来解释。A、C 只看当下。B 割裂衔接，忽视了分数与方程是初中代数（分式、方程、不等式）的直接前身。","id":"UP-S8-09","bank":"up","level":"S8","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子遇到复杂的不规则图形面积就只会套公式，一变化就懵，怎么办？\" 按 S8 的面积策略，正确做法是：","opts":["再背更多的面积公式，公式储备够了总能对上一个，以量取胜最省事","只做标准图形题，不做不规则图形，不规则的直接放弃","先理解割补、容斥、差不变的适用场景，再通过变式训练建立“看题选策略”的能力","不规则图形太难，先放弃，把规则图形的分先稳稳拿住"],"correct":2,"source":"S8\"先理解每种策略（割补/容斥/差不变）的适用场景，再通过变式训练建立'看题选策略'的能力\"；\"打破公式套用依赖\"。","explain":"【依据】S8\"先理解每种策略（割补/容斥/差不变）的适用场景，再通过变式训练建立'看题选策略'的能力\"；\"打破公式套用依赖\"。　C 把\"策略选择\"作为核心能力来讲，正是 S8 面积模块的设计初心。A 继续加公式量，治不了\"一变化就懵\"。B、D 用回避取代训练，而不规则图形面积（割补、容斥、差不变）正是 S8 的核心难点。","id":"UP-S8-10","bank":"up","level":"S8","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"家长说：\"六年级内容不多了，主要就是复习吧？\" 按 S9，正确的判断是：","opts":["六年级是“新学 + 综合”的双重压力——上学期还有圆、百分数、比等新知识，不是单纯复习","对，六年级主要就是复习，没什么新内容，把小学六年学过的东西过一遍就好","六年级不太重要，随便学学就行，反正小升初主要还是看基础","六年级只需要复习，不用学新知识，新知识等到初中再学也不迟"],"correct":0,"source":"S9\"家长常见误判\"中\"六年级内容不多，主要是复习\"一栏，底层问题是\"'新学 + 同步综合'的双重压力被低估。六年级上还有圆、百分数、比等大量新知识。\"","explain":"【依据】S9\"家长常见误判\"中\"六年级内容不多，主要是复习\"一栏，底层问题是\"'新学 + 同步综合'的双重压力被低估。六年级上还有圆、百分数、比等大量新知识。\"　A 纠正了家长\"六年级≈复习\"的普遍错觉，点明\"新学 + 综合\"的双重压力。B、D 延续了同一误判。C 贬低了收官年的价值，与\"决定小升初最终成绩\"的定位冲突。","id":"UP-S9-01","bank":"up","level":"S9","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"几何模型让孩子记下来、套着用不就行了？\" 按 S9，正确的是：","opts":["对，把模型名字记住，遇到就往上面套，考试考的就是那几个模型，记熟就能拿分","模型太多，学一两个最常用的就够了，其余的等遇到了再学","模型“知道但不会用、条件一变就选错”，本质是没练过识别与选策略","模型靠天赋教不会，孩子之间空间想象力的个体差异实在太大了"],"correct":2,"source":"S9\"几何不再'选错模型'——建立图形特征 → 模型匹配法\"；\"家长常见误判\"中\"几何模型记下来套就行\"一栏，底层问题是\"模型识别和策略选择没训练，需要建立'看图形特征 → 匹配模型 → 选择策略'的决策能力\"。","explain":"【依据】S9\"几何不再'选错模型'——建立图形特征 → 模型匹配法\"；\"家长常见误判\"中\"几何模型记下来套就行\"一栏，底层问题是\"模型识别和策略选择没训练，需要建立'看图形特征 → 匹配模型 → 选择策略'的决策能力\"。　C 抓住了 S9 几何的核心——不是\"记住模型\"，而是\"识别并选对模型\"。A 正是家长误判原话，也是孩子\"知道但不会用\"的根源。B 自我缩限，与\"四大模型全掌握\"的目标冲突。D 用天赋论消解教学价值。","id":"UP-S9-02","bank":"up","level":"S9","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长说：\"综合题就是多练几道，练多了自然就会了吧？\" 按 S9，正确的是：","opts":["对，题海战术对综合题最有效，题目见得多了思路自然就广，量变到质变","综合题没法教，只能靠孩子自己慢慢悟，悟性决定孩子的上限","只做单章题就好，综合题可以先跳过，先把单章的分稳稳拿住","跨模块综合题读完就放弃，本质是缺“题型 → 模型 → 策略”的元认知框架"],"correct":3,"source":"S9\"综合题不再'懵'——建立题型识别元认知框架\"；\"家长常见误判\"中\"综合题就是多练几道\"一栏，底层问题是\"缺乏'题型 → 模型 → 策略'的元认知框架，需要系统建立综合题型的识别和拆解方法论\"。","explain":"【依据】S9\"综合题不再'懵'——建立题型识别元认知框架\"；\"家长常见误判\"中\"综合题就是多练几道\"一栏，底层问题是\"缺乏'题型 → 模型 → 策略'的元认知框架，需要系统建立综合题型的识别和拆解方法论\"。　D 点出综合题的真正门槛是\"元认知框架\"，这是 S9 区别于纯刷题的关键。A 与白皮书明确否定的\"多练就会\"相冲突。B 用\"靠悟\"否定教学方法的存在。C 用跳过回避——综合题正是 S9 的核心训练目标。","id":"UP-S9-03","bank":"up","level":"S9","n":3,"kp":"A","diff":"易","levelTag":"易"},{"q":"家长问：\"你们 S9 的'三个跨越'是哪三个？\" 下列哪项**不属于** S9 的\"三个跨越\"？","opts":["从“会做单章题”到“会解综合题”，能跨模块拆解综合应用","从“算术直算”到“代数建模”，学会设未知数、列方程","从“被动套模型”到“主动选策略”，先识别特征再选方法","从“能做完”到“能做对做全”，用反思闭环保证正确率"],"correct":1,"source":"S9：\"从'会做单章题'到'会解综合题'，从'被动套模型'到'主动选策略'，从'能做完'到'能做对做全'的三个跨越。\"","explain":"【依据】S9：\"从'会做单章题'到'会解综合题'，从'被动套模型'到'主动选策略'，从'能做完'到'能做对做全'的三个跨越。\"　B 是 S8（五年级）的跨越。A、C、D 为白皮书原文。至此，S4→S9 六组\"三个跨越\"辨析全部覆盖，学员若能全部答对，说明学段知识已成体系。","id":"UP-S9-04","bank":"up","level":"S9","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"几何模型那么多，孩子怎么才能快速判断该用哪一个？\" 按 S9 白皮书，几何模型的快速识别法是：","opts":["“看线相交 → 鸟头 / 蝴蝶，看平行 → 相似 / 燕尾”，先判特征再选策略","把所有几何模型的名字和图形都背下来，考试时挨个对照着用","遇到几何题一律用割补法来做，割补是万能的，简单又直接","只能靠灵感和经验来判断，模型选择本身并没有什么规律可循"],"correct":0,"source":"S9\"训练'看线相交 → 鸟头/蝴蝶，看平行 → 相似/燕尾'的快速识别能力，先判基本特征再选精细策略\"。","explain":"【依据】S9\"训练'看线相交 → 鸟头/蝴蝶，看平行 → 相似/燕尾'的快速识别能力，先判基本特征再选精细策略\"。　A 是白皮书给出的具体识别法则，可操作、可复述。B 只记名字，解决不了\"条件一变就选错\"。C 一刀切，与\"看图形特征选策略\"的方法冲突。D 用\"靠灵感\"否定方法，与\"模型识别和策略选择\"可训练的立场相悖。","id":"UP-S9-05","bank":"up","level":"S9","n":5,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长说：\"孩子六年级的圆和扇形总错，一到曲边图形就完全不知道从哪入手。\" 按 S9，正确的思路是：","opts":["圆太难，可以先放弃，曲边图形在小升初考试里占比不大，把会做的分拿稳更实际","只要把 πr² 这个公式背下来就行，圆的题目都是套公式","只做标准圆的题目，不做组合图形，组合图形又绕又难","先理解圆的周长面积从“割圆”怎么推导，曲边图形用割补化归成熟悉图形"],"correct":3,"source":"S9\"圆和扇形不再'沦陷'——从公式记忆到推导运用\"：\"先理解圆的周长和面积如何从'割圆'推导而来，再掌握扇形与整体圆的比例关系，曲边图形用'割补拼合'策略化归。\"","explain":"【依据】S9\"圆和扇形不再'沦陷'——从公式记忆到推导运用\"：\"先理解圆的周长和面积如何从'割圆'推导而来，再掌握扇形与整体圆的比例关系，曲边图形用'割补拼合'策略化归。\"　D 完整复刻白皮书的三层思路（推导理解 → 比例关系 → 割补化归）。A、C 用回避取代学习。B 只背一个公式，遇到曲边组合图形无从下手——白皮书特别强调\"曲边图形有策略不畏惧\"。","id":"UP-S9-06","bank":"up","level":"S9","n":6,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"综合题到底怎么入手？孩子一点思路都没有。\" 按 S9 的元认知解题框架，正确的是：","opts":["拿到题直接算，不算就不知道会不会，边算边找思路，算到哪算哪","先问“属于哪类题型、用什么核心关系、怎么列方程”，用方程法统一建模","综合题靠猜，猜对是运气，猜不对就直接跳过去，不必纠缠","只做自己熟悉的题型，陌生的综合题直接放弃反而更划算"],"correct":1,"source":"S9\"综合题不再'懵'——建立题型识别元认知框架\"：\"遇到综合题先问'这属于哪类题型（工程/浓度/行程/经济）→ 该用哪种核心关系 → 怎么列方程'\"。","explain":"【依据】S9\"综合题不再'懵'——建立题型识别元认知框架\"：\"遇到综合题先问'这属于哪类题型（工程/浓度/行程/经济）→ 该用哪种核心关系 → 怎么列方程'\"。　B 把\"元认知框架\"落成了可执行的三步提问，这正是 S9 的核心方法论。A 跳过识别环节直接算，是\"综合题一做就懵\"的典型表现。C 用\"猜\"替代方法。D 回避综合题——而综合建模正是 S9 的目标能力。","id":"UP-S9-07","bank":"up","level":"S9","n":7,"kp":"B","diff":"中","levelTag":"中"},{"q":"家长问：\"孩子'浓度问题'总错，让他背公式行不行？\" 按 S9，正确的是：","opts":["背公式就行，背熟了自然会用，浓度题的公式就那几个，记住了直接套","浓度问题小学不考，可以先跳过，等初中再学也完全来得及","建立“浓度方程统一建模法”，用方程和不变量法处理混合溶液，而不是背零散公式","浓度问题只在生活里有用，跟升学关系不大，了解一下即可"],"correct":2,"source":"S9 专题 8\"浓度问题全类型：对应《百分数》应用。攻克混合溶液浓度与不变量法题，建立浓度方程统一建模法\"。","explain":"【依据】S9 专题 8\"浓度问题全类型：对应《百分数》应用。攻克混合溶液浓度与不变量法题，建立浓度方程统一建模法\"。　C 与白皮书一致——浓度问题的解法是\"统一建模 + 抓不变量\"，而非碎片公式。A 的背公式在混合溶液、加水蒸发等变式上会失效（浓度问题的关键往往在不变量，如水不变、糖不变）。B、D 都低估了浓度问题在小升初综合题中的地位。","id":"UP-S9-08","bank":"up","level":"S9","n":8,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长问：\"六年级建立的这些综合能力，进了初中还有用吗？\" 下列理解正确的是：","opts":["综合建模、几何模型策略和元认知反思习惯，不仅决定小升初成绩，更是进初中的通行证","只在小升初考试里用一下，之后就没用了，初中再重新开始","与初中数学没有关系，初中数学的体系和小学的完全不同","主要是为了应付六年级期末考试，考完这一段就翻篇了，不必太在意长远"],"correct":0,"source":"S9\"这一年建立的综合建模能力、几何模型策略和元认知反思习惯，不仅决定小升初的最终成绩，更是通往初中数学的关键通行证\"。","explain":"【依据】S9\"这一年建立的综合建模能力、几何模型策略和元认知反思习惯，不仅决定小升初的最终成绩，更是通往初中数学的关键通行证\"。　A 直引白皮书，把 S9 的价值延伸到初中。B、D 只看短期。C 割裂衔接——元认知反思习惯（看题识别题型、解后反思）恰恰是初中数学学习最依赖的通用能力。","id":"UP-S9-09","bank":"up","level":"S9","n":9,"kp":"C","diff":"难","levelTag":"难"},{"q":"家长说：\"孩子单章题都会，可一遇综合题——比如比例加行程、浓度加经济——就不知道从哪下手。\" 按 S9，最合适的建议是：","opts":["继续多做单章题，做透了自然能迁移到综合题上，单章是综合的基础","综合题只能靠天赋教不会，孩子的悟性决定了能做到的上限","综合题太难，可以先放弃，把单章题目的分数先稳稳拿住","训练“识别题型 → 匹配模型 → 选策略”的元认知，把综合题拆成已有模型再建模"],"correct":3,"source":"S9\"元认知：看题选策略 → 解后反思\"；\"学霸习惯：【元认知闭环】养成：读题 → 识别题型 → 匹配模型 → 列式求解 → 反思策略 → 优化迁移\"。","explain":"【依据】S9\"元认知：看题选策略 → 解后反思\"；\"学霸习惯：【元认知闭环】养成：读题 → 识别题型 → 匹配模型 → 列式求解 → 反思策略 → 优化迁移\"。　D 把白皮书的元认知闭环讲清楚了——先识别、再匹配、后建模，并强调\"解后反思\"这一易被忽略的环节。A 继续做单章题，无法解决\"综合就不会\"的问题（这正是白皮书点出的痛点）。B 用天赋论否定教学。C 用放弃回避——综合建模正是 S9 要交付的核心能力。","id":"UP-S9-10","bank":"up","level":"S9","n":10,"kp":"C","diff":"难","levelTag":"难"}],[{"q":"豌豆益智课程的班型设置，下列说法正确的是？","opts":["固定一周 3 节课，全级别统一为满班 8 人班，人数不做区分","固定一周 2 节课，S1 为满班 6 人班，S2 至 S9 为满班 8 人班","固定一周 2 节课，全级别统一为满班 6 人班，保证老师关注度","一周课节数不固定，满班人数按报名情况在 6 到 8 人之间浮动"],"correct":1,"source":"第 3 页「班型设置：固定一周 2 节课；S1 满班 6 人班；S2-S9 满班 8 人班」","explain":"【依据】第 3 页「班型设置：固定一周 2 节课；S1 满班 6 人班；S2-S9 满班 8 人班」　B 三项全对。C 把 S2-S9 的 8 人班错成 6 人；A 连每周节数也错了；D 把排班时的临时余量当成规则。同页还有一条要一起记：授课语言支持普通话、粤语、全英、中英（中教/外教），台湾为普通话繁体课件。","id":"DOWN-01","bank":"down","module":1,"module_name":"课程设置与排课","n":1,"kp":"A","diff":"易","levelTag":"易"},{"q":"豌豆益智课程的课时长度，按级别是如何设置的？","opts":["全级别统一 30 分钟，按低龄孩子的注意力时长设计","全级别统一 40 分钟，与校内一节课的时长保持一致","S1 为 30 分钟/课时，S2 至 S9 为 40 分钟/课时","课时长度由老师根据课堂安排灵活调整，没有统一标准"],"correct":2,"source":"第 3 页「课程时长：S1 30 分钟/课时；S2~S9 40 分钟/课时」","explain":"【依据】第 3 页「课程时长：S1 30 分钟/课时；S2~S9 40 分钟/课时」　C 正确。本条与第 1 题共用同一个记忆点——\"S1 和 S2-S9 不同\"，班型、时长必须成对记。A、B 都说成全级别统一，正是最容易答错的口径；D 的\"灵活调整\"在规则里不存在。","id":"DOWN-02","bank":"down","module":1,"module_name":"课程设置与排课","n":2,"kp":"A","diff":"易","levelTag":"易"},{"q":"系统会自动预排未来 7 节课程，这 7 节课的课时如何处理？","opts":["提前消耗 7 课时用于占位，并非真实划扣，课时并没有减少","属于系统多扣，需提交工单登记后由人工核实并追回","已真实划扣 7 课时，后续上课不会再重复扣，属正常扣费","每上完一节退回一节，实际可用课时比页面显示少 7 节"],"correct":0,"source":"第 3 页「系统会自动预排未来 7 节课程（提前消耗 7 课时，并非真实划扣）」","explain":"【依据】第 3 页「系统会自动预排未来 7 节课程（提前消耗 7 课时，并非真实划扣）」　A 抓住两个关键词——\"提前消耗\"和\"并非真实划扣\"，缺一不可。C 把\"预占\"说成\"已扣\"，方向完全相反；D 自创\"上完一节退回一节\"的机制；B 把规则问题当成系统故障去提工单，会把简单的解释升级成事故。","id":"DOWN-03","bank":"down","module":1,"module_name":"课程设置与排课","n":3,"kp":"B","diff":"中","levelTag":"中"},{"q":"新生报名后，排课进度是怎样的？","opts":["从所定级的第一节课开始上，保证知识点不出现断层","直接衔接老生班级的当前进度上课，不用管专题第几讲","等新班级凑齐人数开班后，从新班级的第一节课开始上","插班到现有进度的老生班级，从当前专题的第一讲插班"],"correct":3,"source":"第 4 页「排课进度：新生报名后，都是插班到现有进度的老生班级的（并非从所定级的第一节课开始学习）」；第 6 页「若新生开课或老生复课等调班场景，需从新专题的第一讲次插班」","explain":"【依据】第 4 页「排课进度：新生报名后，都是插班到现有进度的老生班级的（并非从所定级的第一节课开始学习）」；第 6 页「若新生开课或老生复课等调班场景，需从新专题的第一讲次插班」　D 同时说对两件事——插进的是老生现有班级，插入点是当前专题的第一讲。A 是家长最普遍的误解；B 对了一半（确实插老生班），但\"不用管第几讲\"是致命的：专题没从第一讲进，孩子会直接接不上。这条规则同样适用于复课（第 12 题）。","id":"DOWN-04","bank":"down","module":1,"module_name":"课程设置与排课","n":4,"kp":"B","diff":"中","levelTag":"中"},{"q":"老生停课后复课、或新生开课需要插班时，进入的讲次按什么规则计算？","opts":["每个专题 4 节课，第一讲一定是双数，按 4X-2 讲计算（X 为专题数）","一个级别共 24 个专题，第一讲按 4X+1 讲计算，避免讲次编号重复","一个专题 6 个讲次，第一讲按 6X-5 讲计算（X 为专题数）","每个专题 4 节课，第一讲一定是单数，按 4X-3 讲计算（X 为专题数）"],"correct":3,"source":"第 5 页「共 9 个级别，每一级别 96 节课，分 A、B、C、D 四个阶段；每阶段 6 个专题，每专题 4 讲次，一个级别共 24 个专题」；第 6 页「每个 4 节课一个完整专题，专题的第一讲一定是一个单数，即 4X-3 讲」","explain":"【依据】第 5 页「共 9 个级别，每一级别 96 节课，分 A、B、C、D 四个阶段；每阶段 6 个专题，每专题 4 讲次，一个级别共 24 个专题」；第 6 页「每个 4 节课一个完整专题，专题的第一讲一定是一个单数，即 4X-3 讲」　D 正确——4X-3（X 为专题数）一定是单数，这就是\"卡专题第一讲\"的算法依据。A 把单数说成双数、公式差 1；B、C 的专题结构本身就错（每专题 4 讲，不是 6 讲）。背景数据一并记：9 级 × 每级 96 节，每级 4 阶段 × 6 专题 × 4 讲。","id":"DOWN-05","bank":"down","module":1,"module_name":"课程设置与排课","n":5,"kp":"B","diff":"难","levelTag":"难"},{"q":"老生因时间、老师或级别不合适需要调班，应由谁发起调课？","opts":["家长在家长端自行选班提交，无需经过 LP 处理","主讲老师发起，LP 只负责把调班结果转告家长","由 LP 发起调课，把时间、老师、级别的诉求提给教务处理","由教务直接发起并完成，LP 与家长都不需要参与"],"correct":2,"source":"第 4 页「排课类型——老生：因为时间/老师/级别不合适等原因造成的调班，由 LP 发起调课」","explain":"【依据】第 4 页「排课类型——老生：因为时间/老师/级别不合适等原因造成的调班，由 LP 发起调课」　C 是规则原文，老生调班的发起方就是 LP——这也是 LP 服务价值的直接体现。A 把操作推给家长，家长端并没有这个入口；B 张冠李戴到主讲老师；D 漏掉了 LP 这个必经环节。","id":"DOWN-06","bank":"down","module":1,"module_name":"课程设置与排课","n":6,"kp":"C","diff":"易","levelTag":"易"}],[{"q":"关于家长端请假的时间边界，下列说法正确的是？","opts":["家长端请假没有时间限制，开课前任何时间都能自主操作","课前 15 分钟起家长无法操作请假，但 LP 和主讲老师可以操作","课前 15 分钟起所有人都无法操作请假，只能按旷课处理","课前 15 分钟起家长不能操作，只能打电话给客服人工登记"],"correct":1,"source":"第 7 页「建议告知家长提前 24 小时请假，最晚可自主通过豌豆素质家长端操作（课程协议是提前 3 小时）；课前 15 分钟，家长无法操作请假，LP 和主讲老师可以操作」","explain":"【依据】第 7 页「建议告知家长提前 24 小时请假，最晚可自主通过豌豆素质家长端操作（课程协议是提前 3 小时）；课前 15 分钟，家长无法操作请假，LP 和主讲老师可以操作」　B 给出的是精确边界——15 分钟是**家长端**的分界线，但请假这件事仍可由 LP 或主讲老师操作，两个概念不能混。C 把\"家长不能操作\"等同于\"不能请假\"，还会误记旷课（旷课才扣 1 课时）；A 无视时间限制；D 的\"打电话给客服\"是编出来的流程。建议口径一并记住：建议提前 24 小时，课程协议是提前 3 小时。","id":"DOWN-07","bank":"down","module":2,"module_name":"请假、补课与休学","n":7,"kp":"A","diff":"中","levelTag":"中"},{"q":"请假次数与课时扣除的关系是？","opts":["每次请假都要扣 1 课时，次数只是提醒，没有实际约束力","请假不扣课时也不扣次数，只要提前告知老师就可以","次数用完后剩余课时全部冻结，需重新购买才能继续上课","在对应次数内请假扣次数不扣课时，超出次数后请假扣课时"],"correct":3,"source":"第 7 页「请假有次数限制，不同课包请假次数不同。在对应次数内请假扣请假次数，不扣课时；超出次数后，请假扣课时」","explain":"【依据】第 7 页「请假有次数限制，不同课包请假次数不同。在对应次数内请假扣请假次数，不扣课时；超出次数后，请假扣课时」　D 是完整的规则闭环——先扣次数、超了才扣课时，两段要说全。A 混淆了请假与旷课（旷课才扣 1 课时）；B 完全没有次数概念；C 的\"冻结课包\"不存在。另注意：**课包的请假次数不会叠加到另一个课包**，不同课包的请假次数也不同。","id":"DOWN-08","bank":"down","module":2,"module_name":"请假、补课与休学","n":8,"kp":"A","diff":"中","levelTag":"中"},{"q":"两种补课方式与课时扣除的对应关系是？","opts":["直播补课（插班真人补课）扣除课时，AI 补课（课程回放）不扣课时","两种补课都不扣课时，由系统自动安排，家长无需关心费用","AI 补课扣除课时，直播补课不扣，真人课成本更高所以免费","两种都扣课时，直播补课扣 1 节，AI 补课扣半节，可自行选择"],"correct":0,"source":"第 7 页「补课——直播补课（插班真人补课），扣除课时；AI 补课（课程回放），不扣课时」","explain":"【依据】第 7 页「补课——直播补课（插班真人补课），扣除课时；AI 补课（课程回放），不扣课时」　A 是唯一把\"哪种补课扣费\"对应对的。C 把扣费关系说反了；D 自创\"扣半节\"，课包计量里没有这种单位；B 的\"都不扣\"是最容易被顺着家长说的错话。这条也是向家长推荐 AI 补课的价值点——不扣课时。","id":"DOWN-09","bank":"down","module":2,"module_name":"请假、补课与休学","n":9,"kp":"B","diff":"易","levelTag":"易"},{"q":"关于课时的消耗顺序与请假、旷课，下列说法正确的是？","opts":["课时按课包内随机顺序消耗，请假次数可以叠加到下一个课包","课时按获得的先后顺序消耗；请假次数不跨课包叠加；旷课扣 1 课时","课时按剩余有效期长短消耗；旷课不扣课时，只影响出勤记录","课时按家长指定的顺序消耗；请假次数用完自动清零重新计算"],"correct":1,"source":"第 7 页「注意事项——课时消耗原则：按课时获得的先后顺序消耗。课包的请假次数不会叠加到另一个课包。旷课需要扣 1 课时」","explain":"【依据】第 7 页「注意事项——课时消耗原则：按课时获得的先后顺序消耗。课包的请假次数不会叠加到另一个课包。旷课需要扣 1 课时」　B 三条全对。这三条经常被拆开记混：消耗顺序是\"先到先消耗\"，不是随机的；请假次数绑定在课包上、不能跨包叠加；扣 1 课时的是**旷课**，不是请假。A、C、D 各把其中一条改成了不存在的机制。","id":"DOWN-10","bank":"down","module":2,"module_name":"请假、补课与休学","n":10,"kp":"B","diff":"中","levelTag":"中"},{"q":"关于停课（休学）规则，下列说法正确的是？","opts":["不同课包停课机会相同，一次最长 60 天，停课期间课时完全冻结","停课时间不限，想停多久都可以，复课时再联系 LP 排课即可","一次办理不超过 30 天，到 31 天未排课会自动按每周 2 节划扣课时","课包不支持停课，只能继续上课或直接办理退费，没有中间选项"],"correct":2,"source":"第 8 页「休学规则——不同课包对应不同停课机会，一次办理不超过 30 天，到 31 天未排课会自动按照每周 2 节划扣课时（特殊情况可延长）」","explain":"【依据】第 8 页「休学规则——不同课包对应不同停课机会，一次办理不超过 30 天，到 31 天未排课会自动按照每周 2 节划扣课时（特殊情况可延长）」　C 把两个关键数字都说准了——30 天上限、第 31 天起自动按每周 2 节划扣。A 的 60 天是最常见的误记，且\"完全冻结\"与规则相反；B 的\"不限时长\"错得最离谱，会让家长白白损失课时；D 直接否定，把一个能解决的问题推成退费。另注：停课机会次数因课包而异，特殊情况可延长。","id":"DOWN-11","bank":"down","module":2,"module_name":"请假、补课与休学","n":11,"kp":"C","diff":"难","levelTag":"难"},{"q":"学员停课后申请复课，下列说法正确的是？","opts":["系统会优先把复课学员排回原班级，原班有名额就不会变","停课后立即释放学位，复课需重新排课，无法保证回到原老师班级","复课自动回到原班原进度，上课时间和进度都无需重新确认","复课不需要卡专题第一讲，哪天有空就从哪一天开始上课"],"correct":1,"source":"第 8 页「停课后立即释放学位，复课需重新排课，无法保证回到原老师班级，班主任需提前告知家长」","explain":"【依据】第 8 页「停课后立即释放学位，复课需重新排课，无法保证回到原老师班级，班主任需提前告知家长」　B 同时覆盖\"释放学位\"和\"需提前告知\"两个动作——后者是 LP 的服务责任，不说在前头就是后续投诉的引信。A、C 的\"优先回原班/自动回原进度\"是规则里没有的承诺；D 错在复课同样要卡专题第一讲（4X-3 讲，见第 5 题）。","id":"DOWN-12","bank":"down","module":2,"module_name":"请假、补课与休学","n":12,"kp":"C","diff":"中","levelTag":"中"}],[{"q":"新生消耗课时在 4 节课内申请退费，处理方式是？","opts":["按“购买价格 ÷ 基础直播课时 × 已上课时”扣费，退还剩余金额","需扣除已上课时费用，剩余部分走财务线下打款，约 1 个月到账","课包一经消耗不支持退费，只能把剩余课时转给其他孩子使用","属于无忧试学范围，可全额退费，不扣除已上课时的费用"],"correct":3,"source":"第 9 页「退费——新生消耗课时，4 节课内：无忧试学，全额退费」","explain":"【依据】第 9 页「退费——新生消耗课时，4 节课内：无忧试学，全额退费」　D 卡准\"四节课内\"这个边界。A、B 都提前套用了\"超过 4 节\"的算法，把本可全额退的单子算成扣费单；C 的\"不支持退费\"与无忧试学政策直接冲突。处理这类单子，第一步永远是先确认已上课时数。","id":"DOWN-13","bank":"down","module":3,"module_name":"退费与挽单","n":13,"kp":"A","diff":"易","levelTag":"易"},{"q":"新生超过 4 节课申请退费，扣费金额如何计算？","opts":["按“购买价格 ÷ 基础直播课时（不含赠课）× 已上课时”计算，以系统自动结算为准","按“购买价格 ÷ 总课时（含赠课）× 已上课时”计算，赠课一并摊入总数","按“已上课时 × 单节正价”计算，剩余部分全退，不产生任何手续费","超过 4 节课的课包不再退费，剩余课时只能转赠给其他孩子使用"],"correct":0,"source":"第 9 页「超过 4 节课退费：购买价格/基础直播课时（不含赠课）×已上课时=扣费金额，以系统自动结算为准」","explain":"【依据】第 9 页「超过 4 节课退费：购买价格/基础直播课时（不含赠课）×已上课时=扣费金额，以系统自动结算为准」　A 的关键在分母是\"基础直播课时（**不含赠课**）\"——把赠课算进分母会摊薄单价、算高已上课时金额，家长吃亏，也最容易在退款金额上起争议，B 正是这个误区。C 忽略了合同价与单节价的差异；D 直接违反退费政策。\"以系统自动结算为准\"要一并说，避免家长手算后对不上。","id":"DOWN-14","bank":"down","module":3,"module_name":"退费与挽单","n":14,"kp":"A","diff":"难","levelTag":"难"},{"q":"关于退费的挽单分工与流程，下列说法正确的是？","opts":["四节课内归 LP 挽单，需走完整一挽二挽流程，失败 24 小时内 OA 发起","四节课外归 CC 挽单，LP 只负责记录原因，结果与 LP 没有关系","四节内归 CC 挽、四节外归 LP 挽；LP 须走一挽二挽，失败 48 小时 OA 发起","挽单由签单的 CC 全程负责跟进，LP 只在家长坚持退费时办理手续"],"correct":2,"source":"第 9 页「挽单——四节课内：CC 挽单；四节课外：LP 挽单。LP 挽单必须要有完整的一挽二挽流程，挽单失败 48 小时 OA 发起退费申请」","explain":"【依据】第 9 页「挽单——四节课内：CC 挽单；四节课外：LP 挽单。LP 挽单必须要有完整的一挽二挽流程，挽单失败 48 小时 OA 发起退费申请」　C 三个要素全对——4 节内归 CC、4 节外归 LP、LP 须走完整一挽二挽且失败 48 小时 OA 发起。A 把\"4 节内 / 4 节外\"的分界记反，时效也记成 24 小时；B 把 LP 的核心挽单责任推给 CC；D 的\"谁签谁挽\"不是规则，分工只看已上课时数。","id":"DOWN-15","bank":"down","module":3,"module_name":"退费与挽单","n":15,"kp":"B","diff":"难","levelTag":"难"},{"q":"关于退费到账时效，统一口径是？","opts":["一般情况原路退回，统一口径 2-3 周；特殊情况财务线下打款，约 1 个月","统一口径 3 个工作日原路退回，特殊情况线上处理，不超过一周","一般情况原路退回约 1 个月，特殊情况线下打款更快，一周左右","到账时间由银行决定，LP 无法给出口径，只能让家长耐心等待"],"correct":0,"source":"第 9 页「退费时效——一般情况原路退回：统一口径 2-3 周。如遇特殊情况需财务线下打款：统一口径 1 个月左右」","explain":"【依据】第 9 页「退费时效——一般情况原路退回：统一口径 2-3 周。如遇特殊情况需财务线下打款：统一口径 1 个月左右」　A 是对外的统一口径，两个通道不能记反——原路退回快（2-3 周）、线下打款慢（约 1 个月）。B 的\"3 个工作日\"是随口承诺，兑现不了就是二次投诉；C 把两个通道的时效对调；D 的\"给不了口径\"最伤信任，规则里有明确数字就必须说清楚。","id":"DOWN-16","bank":"down","module":3,"module_name":"退费与挽单","n":16,"kp":"B","diff":"中","levelTag":"中"}],[{"q":"关于课后巩固（每节课）的入口、题量与注意事项，下列说法正确的是？","opts":["入口在家长端 APP，题量 8 题左右，以测试形式呈现并出报告","入口在学生端，题量 6 题左右，注意中途退出需重新开始做题","入口在学生端，每专题结束后做一次，题量 8 题左右","没有线上巩固，全靠纸质豌豆宝典，做完拍照发给 LP 批改"],"correct":1,"source":"第 25 页「课后巩固（每节课）：入口豌豆素质学生端；题量 6 题左右；题型选择、填空、连线、拖拽；频率每节课结束后；注意：中途退出需重新开始做题」","explain":"【依据】第 25 页「课后巩固（每节课）：入口豌豆素质学生端；题量 6 题左右；题型选择、填空、连线、拖拽；频率每节课结束后；注意：中途退出需重新开始做题」　B 把入口、题量、易漏的注意事项都说对。A 的\"家长端 + 8 题\"混进了思维自评的特征；C 把\"每节课\"错成\"每专题\"；D 忽略了线上巩固的存在。题型是选择、填空、连线、拖拽，频率为每节课结束后——家长反馈\"孩子做了一半没了\"，多半就是中途退出了。","id":"DOWN-17","bank":"down","module":4,"module_name":"学习闭环与课后配套","n":17,"kp":"A","diff":"易","levelTag":"易"},{"q":"专题复习（AI 复习课）与思维自评的生成条件，区别在哪？","opts":["两者都要求专题 4 节课全部正常出席，缺勤就无法生成","思维自评要求 4 节全部正常出席；专题复习只要 4 节课结束就生成","两者都只要专题 4 节课结束就会生成，与出勤情况没有关系","专题复习要求 4 节全部正常出席；思维自评只要专题 4 节课结束就生成"],"correct":3,"source":"第 25 页「专题复习（每专题）：入口豌豆素质学生端-豌豆游乐园，形式 AI 复习课，生成条件：专题 4 节课全部正常出席（有请假、旷课、补课都无法生成）；思维自评（每专题）：入口学生端-我的自评，形式测试，题量 8 题左右，生成条件：专题 4 节课结束后（有请假、旷课、补课都会生成）」","explain":"【依据】第 25 页「专题复习（每专题）：入口豌豆素质学生端-豌豆游乐园，形式 AI 复习课，生成条件：专题 4 节课全部正常出席（有请假、旷课、补课都无法生成）；思维自评（每专题）：入口学生端-我的自评，形式测试，题量 8 题左右，生成条件：专题 4 节课结束后（有请假、旷课、补课都会生成）」　D 是全 PPT 最容易记混的一对：**专题复习卡出勤，思维自评不卡**。A 把两者一起判死；B 把条件安反了对象；C 抹平了差异。LP 记反这条，家长的追问就会变成\"你们系统是不是坏了\"——正确做法是主动解释\"复习课要 4 节全勤才生成，自评不受影响\"。","id":"DOWN-18","bank":"down","module":4,"module_name":"学习闭环与课后配套","n":18,"kp":"A","diff":"难","levelTag":"难"},{"q":"关于课堂回放，下列说法正确的是？","opts":["有效期 30 天，入口只在学生端；生成只与老师是否开启录制有关","有效期 180 天，但只在家长端能看；回放一定能生成，找不到就是被删","有效期 180 天，入口在学生端和家长端；生成与设备内存、网络、是否立即退教室有关","有效期一年，入口在学生端和家长端；生成与设备内存、网络无关"],"correct":2,"source":"第 24 页「课堂回放：入口豌豆素质学生端、豌豆素质家长端 APP；形式课堂互动录频，不可操作；有效期 180 天；生成条件：与设备剩余内存、用户端网络、下课后不要立即退出教室等原因有关」","explain":"【依据】第 24 页「课堂回放：入口豌豆素质学生端、豌豆素质家长端 APP；形式课堂互动录频，不可操作；有效期 180 天；生成条件：与设备剩余内存、用户端网络、下课后不要立即退出教室等原因有关」　C 把时限、入口、生成条件三点都说对。A 的 30 天记短了，入口也漏了家长端；B 说\"一定能生成\"——回放生成本身受客户端条件影响；D 的一年期限和\"与设备无关\"都不成立。可以据此做预防性提示：下课后不要立即退出教室。","id":"DOWN-19","bank":"down","module":4,"module_name":"学习闭环与课后配套","n":19,"kp":"B","diff":"中","levelTag":"中"},{"q":"关于《豌豆宝典》的寄送规则，下列说法正确的是？","opts":["按级别区分：S1-S3 是 4 节课一本，S4-S9 是 8 节课一本","全级别统一 8 节课寄一本，需要更多可以自行购买加购","全级别统一 4 节课寄一本，级别越高题量越大但周期相同","不寄纸质版，只有电子版，家长在群里下载链接自行打印"],"correct":0,"source":"第 25 页「豌豆宝典：寄送纸质版；形式专题拓展练习题，题型综合性强难度大、开放性题型；寄送规则 S1-S3，4 节课一本；S4-S9，8 节课一本」；第 27 页「海外不涉及邮寄（除香港地区）；电子版教材（豌豆宝典）可针对所有学员外发（教研群链接自取）」","explain":"【依据】第 25 页「豌豆宝典：寄送纸质版；形式专题拓展练习题，题型综合性强难度大、开放性题型；寄送规则 S1-S3，4 节课一本；S4-S9，8 节课一本」；第 27 页「海外不涉及邮寄（除香港地区）；电子版教材（豌豆宝典）可针对所有学员外发（教研群链接自取）」　A 是分级的寄送节奏。B、C 把两种周期抹平，家长一旦按错误的节奏催寄，就会变成\"你们漏发了\"的误会；D 也不对——纸质版默认寄送，电子版是补充渠道。另外海外学员（除香港）不邮寄，要提前说明。","id":"DOWN-20","bank":"down","module":4,"module_name":"学习闭环与课后配套","n":20,"kp":"B","diff":"易","levelTag":"易"}],[{"q":"V9 课件「升级一：课程适配度升级」包含哪些内容？","opts":["全级别统一更换新课件，只是换皮，难度、课节数和课节安排都完全不变","S1-S3 删减超纲内容，S4-S9 全部新增英文课件，全面向海外课纲看齐","只升级界面与动画效果，课程内容、课节数和难度都没有做任何调整","S4-S7 删减超纲过难的课；S7 新增北美、新加坡四年级校内重难点；S8 新增英文课件"],"correct":3,"source":"第 35 页「升级一：课程适配度升级——1）S4-S7 难度和课节删减（总框架不变，特色课程保留，超纲和难度过高课程删减）；2）V8 版本的 S7 级别校内课程严重缺失，新增北美和新加坡四年级校内内容重难点；3）S8 新增英文课件，本地化语言，内容向海外课纲难度靠近」","explain":"【依据】第 35 页「升级一：课程适配度升级——1）S4-S7 难度和课节删减（总框架不变，特色课程保留，超纲和难度过高课程删减）；2）V8 版本的 S7 级别校内课程严重缺失，新增北美和新加坡四年级校内内容重难点；3）S8 新增英文课件，本地化语言，内容向海外课纲难度靠近」　D 三条都对。A 的\"只是换皮\"否定了删减的价值——删掉的恰恰是超纲和过难内容，这是卖点不是缩水；B 把删减范围错到 S1-S3、把英文课件安到 S4-S9；C 完全否定内容变化，家长后续发现课节数变了，会认为是偷偷缩水。","id":"DOWN-21","bank":"down","module":5,"module_name":"V9 升级与豌豆币","n":21,"kp":"A","diff":"中","levelTag":"中"},{"q":"V9「升级三：AI 赋能」最核心的价值点是？","opts":["只生成学习报告给家长自行查看，是否补课由家长自己决定","检测到某知识点持续薄弱时，自动安排加强课，由授课老师一对一辅导","直接给孩子更换更合适的级别，调到新班级重新开始学习","AI 只统计首答率和末答率给教研看，与单个孩子的学习无关"],"correct":1,"source":"第 37 页「升级三、AI 赋能，精准定位学习过程问题——当 AI 学习小助手检测到学员在某个知识点上持续表现薄弱时，系统会自动安排加强课任务，由授课老师对孩子进行一对一辅导，实现精准突破」","explain":"【依据】第 37 页「升级三、AI 赋能，精准定位学习过程问题——当 AI 学习小助手检测到学员在某个知识点上持续表现薄弱时，系统会自动安排加强课任务，由授课老师对孩子进行一对一辅导，实现精准突破」　B 点出闭环的最后一环——发现问题之后系统会**自动**派加强课，而且是授课老师一对一，这是 V9 最能打动家长的价值点。A 把闭环断在\"出报告\"；C 的\"换级别\"不是规则；D 只说对了教研侧的数据用途（首答率、末答率，见第 36 页升级二），漏掉了对单个孩子的干预。","id":"DOWN-22","bank":"down","module":5,"module_name":"V9 升级与豌豆币","n":22,"kp":"A","diff":"中","levelTag":"中"},{"q":"关于豌豆币的兑换规则，下列说法正确的是？","opts":["6000 豌豆币 = 1 节直播课，每日兑换上限 5 节","1 万豌豆币 = 1 节直播课，兑换不限次数，可一直攒着","8000 豌豆币 = 1 节直播课，每日兑换上限 10 节","8000 豌豆币 = 1 节直播课，但仅限兑换录播课和实物礼品"],"correct":2,"source":"第 41 页「豌豆币是豌豆商城里面【积分】的另一种称呼，用户可以在豌豆商城使用豌豆币兑换实物礼品、直播课时、各类录播课等。（8000 豌豆币 = 1 节直播课，每日兑换上限：10 节）」","explain":"【依据】第 41 页「豌豆币是豌豆商城里面【积分】的另一种称呼，用户可以在豌豆商城使用豌豆币兑换实物礼品、直播课时、各类录播课等。（8000 豌豆币 = 1 节直播课，每日兑换上限：10 节）」　C 两个数字都对——8000 兑 1 节、每日上限 10 节。A、B 的数字是常见误记；D 的\"仅限录播课和实物礼品\"漏掉了直播课时，豌豆币三类都能换。兑换入口在第 24 题一起考。","id":"DOWN-23","bank":"down","module":5,"module_name":"V9 升级与豌豆币","n":23,"kp":"B","diff":"易","levelTag":"易"},{"q":"豌豆币的有效期是多久？在哪儿兑换使用？","opts":["自获得之日起次年 12 月 31 日清零，在家长端 APP 的豌豆商城兑换","永久有效不会清零，登录家长端 APP 进入豌豆商城即可兑换","当年 12 月 31 日清零，在学生端的豌豆游乐园里兑换礼品","有效期三年，到期自动兑换成课时，不需要家长手动操作"],"correct":0,"source":"第 41 页「豌豆币如何使用：登录豌豆素质家长端 APP，进入豌豆商城，选择心仪的物品即可兑换。豌豆币有效期：自获得之日起，次年 12 月 31 日清零」","explain":"【依据】第 41 页「豌豆币如何使用：登录豌豆素质家长端 APP，进入豌豆商城，选择心仪的物品即可兑换。豌豆币有效期：自获得之日起，次年 12 月 31 日清零 主动找到班主任，语气兴奋：\"老师，我家孩子才 3 岁半，已经能数到 50 了！是不是说明他数感很好，可以直接跳到高一级？S1 太简单了。\"","opts":["能背数到 50 说明数感已经过关，S1 的内容他都会了，可以直接去评估跳一级","家长既然主动提出来了，那就先安排一次高一级的试听，孩子跟得上就不用再纠结","会唱数不等于会点数——数到 50 多是机械背出来的，要先看他能否对着实物一个一个点数、数和东西对得上","这是明显的超前表现，说明他已经越过了 S1 这个阶段，再学小班内容是浪费时间"],"correct":2,"explain":"【依据】S1\"数感萌芽\"明确\"能点数数摆加减、能按物取数不混淆\"；对应\"家长常见误判\"中\"现在还小，等大了自然就会了\"一栏，孩子表现为\"数到 10 跳数，指 3 个苹果说 5 个\"，底层问题是\"数感和一一对应能力未建立，需要手口一致点数的具象经验堆积\"。　C 抓住了白皮书的核心区分——唱数是\"背数字的顺口溜\"，点数是\"数与物一一对应\"，两者是不同能力。会唱数到 50 并不证明数感过关。A、B 都把\"唱数\"直接等同于\"数感达标\"，是家长最常见的误区，班主任如果跟着附和就把专业判断让位了。D 走向另一个极端，同样没有依据——白皮书从未说会唱数就意味着可以跳过 S1。正确动作是先做能力观察（能否点数、能否按数取物），再谈学段。","score":2,"group":"S1","groupLabel":"产品知识上 · S1","id":"UP-S1-01"},{"q":"家长直接问：\"你们 S1 到底让孩子学会什么？能不能给我一个清单，我好检查孩子有没有达标？\" 下列哪一项**最准确**地对应 S1 白皮书的能力目标？","opts":["学会 20 以内的加减法，能规范书写数字，口算又快又准、考试基本不出错","掌握 100 以内数的认识，会做简单的加减应用题，能独立完成一年级的作业","手口一致点数、识别基本图形及特征、建立有序观察习惯、听懂指令并持续完成任务","会背诵乘法口诀，能进行表内乘除法的计算，提前把三年级要用的计算底子打好"],"correct":2,"explain":"【依据】S1\"S1 思维能力建立\"四条——\"手口一致点数，感知数与量；识别 4 种基本图形及其特征；建立有序观察习惯；听懂指令并持续完成任务\"。　C 是白皮书四条目标的准确复述。A、B、D 都是典型的**学段错位**：20 以内加减是 S3/S4 的内容，100 以内数的认识是 S4 专题，乘法口诀是 S5 的起点。班主任一旦把高学段目标安到 S1 头上，就会给家长制造错误的预期，也违背了白皮书\"不抢跑知识\"的立场。","score":2,"group":"S1","groupLabel":"产品知识上 · S1","id":"UP-S1-06"},{"q":"家长困惑：\"我家孩子 1+2=3 能算出来，但我换成'再给几个就变成 5 个'，他就答不出来了。是不是数学太差？\" 按 S2 白皮书，正确的判断是：","opts":["这是计算能力不够，每天加练一页口算题，把熟练度提上来，做题速度和正确率都会上来","这是数量关系直觉没建立——他背住了算式结果，却没有在操作里体会“总数 = 部分 + 部分”，要用实物分合补上","孩子理解力偏弱，建议把整体难度降下来，先从更简单的题型重新开始，慢慢往上走","这很正常，孩子这个年纪理解不了数量关系，等大一点自然就会了，不用特意干预"],"correct":1,"explain":"【依据】S2\"家长常见误判\"中\"加减法教了好多遍还不会\"一栏，孩子表现\"知 1+2=3，换情境问'再给几个变 5 个'就答不出\"，底层问题是\"数量关系直觉未建立，需在大量操作中感知'总数 = 部分 + 部分'\"。　B 精准复制了白皮书的诊断路径，并给出\"实物分合操作\"的解法。A 用\"加练口算\"治标不治本——同一道算式换个情境就废，说明缺的是关系理解而非计算熟练度。C 是给孩子降难度的消极处理。D 属于\"长大就会\"式回避，与 S2 作为数量关系敏感期的定位冲突。","score":2,"group":"S2","groupLabel":"产品知识上 · S2","id":"UP-S2-01"},{"q":"教研时，主管问：\"S2 的数量关系，和 S3 的加减算理，是什么关系？\" 下列理解正确的是：","opts":["S2 靠“分一分、凑一凑”建立“总数 = 部分 + 部分”的直觉，S3 再上算理，是接力不是重复","S2 已经直接教一年级加减法了，和 S3 的内容基本重复，两选一学就够了，没必要都学","S2 只学图形和空间，数量关系要等到 S3 才开始接触，两级分工很清楚","S3 才第一次接触数量关系，S2 以图形为主，跟数基本没有关系"],"correct":0,"explain":"【依据】S2\"③ 数量关系——通过'分一分、凑一凑'自然形成'总数 = 部分 + 部分'直觉，大班加减水到渠成\"；S2 维度表\"数量关系：能感知总数与部分的关系，能用自己的方式解决 10 以内简单加减\"。　A 讲清了两个学段的**衔接逻辑**：S2 建\"关系直觉\"，S3 上\"算理与运算\"，是接力而非重复。B 把衔接误读成重复。C、D 都与 S2 维度表中明确列出的\"数量关系\"能力线相矛盾。","score":2,"group":"S2","groupLabel":"产品知识上 · S2","id":"UP-S2-06"},{"q":"大班家长直奔主题：\"是不是提前把一年级内容学一遍，上学就万事大吉了？\" 按 S3 白皮书，最准确的回应是：","opts":["对，提前把一年级内容学完，上学就能领先一大截，孩子也更有底气不怕跟不上","不用提前学，什么都不用准备，顺其自然就好，孩子到了学校自己会慢慢适应的","比起数学，提前学拼音和识字更重要，数学到了学校老师自然就教，不用抢跑","幼小衔接的核心不是知识量而是思维深度——靠记忆会做加减、一变情境就不会，缺的是“懂算理”和“会思考”"],"correct":3,"explain":"【依据】S3\"家长常见误判\"中\"提前把一年级学一遍就万事大吉\"一栏，孩子表现\"靠记忆会做简单加减，一变情境就不会\"，底层问题是\"'记步骤'和'懂算理'的区别——幼小衔接核心不是知识量而是思维深度\"。　D 把\"抢跑知识\"和\"准备能力\"两个概念划清界限，这正是 S3 的立课根本。A 与白皮书正面冲突。B 走向另一个极端，否认了衔接准备的必要性——白皮书强调的是\"把'会思考、能表达、坐得住'三样能力准备到最佳状态\"。C 属于答非所问，把数学的衔接问题岔到语文上。","score":2,"group":"S3","groupLabel":"产品知识上 · S3","id":"UP-S3-01"},{"q":"家长说：\"孩子一遇到镜面对称、图形展开图这类题就完全懵，是不是空间感太差没救了？\" S3 对应的训练方向是：","opts":["这类题太抽象，大班阶段理解不了，可以先跳过，等上了小学再系统学也不迟","只做平面图形就够了，立体图形等上了小学再学，大班不必抢这一步","让孩子把展开图的几种画法死记硬背下来，考试遇到直接照着画就行","空间要从“平面”走到“立体”：立体图形、展开图与透视、镜面对称判断，建立二维到三维的底层"],"correct":3,"explain":"【依据】S3\"空间不是'看得见就行'——从'平面'到'立体'\"：从平面图形的重叠对应，到立体图形的认识和展开图，再到镜面对称判断，完整覆盖从二维到三维的空间思维进阶。　D 把 S3 的空间能力线完整呈现出来，且强调\"推理底层\"而非记图。A 用\"跳过\"回避。B 只保留平面，丢掉了 S3 明确的立体与对称内容。C 的死记画法与\"能根据一半推断另一半\"的推导要求相悖。","score":2,"group":"S3","groupLabel":"产品知识上 · S3","id":"UP-S3-06"},{"q":"家长一脸无奈：\"我家孩子就是粗心，看错加减号、漏题、算得还慢。打也打了，题也刷了，没用。\" 按 S4 白皮书，正确的底层判断是：","opts":["孩子态度差，需要更严格的管教和更大的刷题量，严管才能出成绩，光讲道理没用","孩子视力可能有问题，建议先带去眼科查一下，排除生理上的原因再说","“粗心”本质是算理不清加上审题流程不稳定——数感没建立，读题和检查的习惯也没形成","天生就马虎，改不了，只能接受，家长平时多提醒、多盯着一点就好"],"correct":2,"explain":"【依据】S4\"家长常见误判\"中\"孩子就是粗心\"一栏，孩子表现\"看错符号、漏题、算得慢\"，底层问题是\"算理不清 + 审题流程不稳定。孩子还没有真正建立数感，也没有形成规范的读题和检查习惯\"。　C 把\"粗心\"这个模糊标签翻译成两个可干预的结构性问题，这正是 S4 的专业价值。A 延续了白皮书批评的\"靠疯狂刷题来纠正\"。B 越界诊断且方向错误。D 是消极放弃，与\"干掉粗心\"的课程目标相悖。","score":2,"group":"S4","groupLabel":"产品知识上 · S4","id":"UP-S4-01"},{"q":"家长说：\"孩子做应用题总是瞎凑数，两个数字随便加减试一试。\" 按 S4 课程设计，正确的应对流程是：","opts":["直接把正确答案给他，让他记住这类题的做法，下次照着做就行","让他多做同类题型，做多了就有感觉了，感觉对了加减就不会选错","圈画关键词 → 画出数量关系图 → 判断加减含义 → 列式计算，建立完整的审题建模流程","把应用题都改成纯口算，去掉情境干扰，先把计算能力练扎实再说"],"correct":2,"explain":"【依据】S4\"应用题不再瞎凑——从'猜加减'到'画关系'\"：\"通过圈画关键词 → 画出数量关系图 → 判断加减含义 → 列式计算，帮孩子建立完整的审题建模流程。\"　C 完整复刻白皮书的四步审题流程。A 给答案不给方法，孩子换个题继续凑。B 靠\"感觉\"正是瞎凑数的根源，与\"把文字题变清楚\"的目标冲突。D 取消情境，等于取消了 S4 最核心的应用题能力训练。","score":2,"group":"S4","groupLabel":"产品知识上 · S4","id":"UP-S4-06"},{"q":"家长说：\"乘法口诀他背得滚瓜烂熟，可一到做题就卡壳，3×5 和 5×3 还分不清。\" 按 S5，正确的底层判断是：","opts":["乘法意义和数感没建立——他不理解“几个几”的本质，只会顺着背口诀，不会双向灵活调用","孩子不用心，需要把口诀再多背几遍，背到脱口而出就不会卡壳了","孩子记忆力差，属于先天问题，换什么方法效果都有限，只能多花时间","口诀本身编得不合理，建议换一套更好记的口诀，问题就解决了"],"correct":0,"explain":"【依据】S5\"家长常见误判\"中\"口诀背了半年还卡壳，就是不用心\"一栏，孩子表现\"乘法口诀顺口溜背得溜，换个顺序就不会，3×5 和 5×3 分不清楚\"，底层问题是\"乘法意义和数感没有建立，孩子不理解'几个几'的本质，只会单向顺口溜\"。　A 把\"背得熟但不会用\"准确解释为\"意义未建立\"。B 与白皮书批评的\"加量背诵\"同类。C 用先天因素解释，既不专业也不负责。D 把教学问题推给口诀本身，方向错误。","score":2,"group":"S5","groupLabel":"产品知识上 · S5","id":"UP-S5-01"},{"q":"家长说：\"孩子做'乘加乘减'这类混合运算总出错。\" 按 S5 课程，正确的是：","opts":["建立“先乘除后加减”的运算顺序感，通过乘加乘减两步计算题反复训练","先算加减再算乘除，从左到右依次算，跟读题的顺序保持一致最不容易错","怎么算都行，结果对就好，方法不必强求统一，孩子用得顺就行","直接教孩子用计算器，避免出错，等大一点再回头补运算顺序"],"correct":0,"explain":"【依据】S5 专题 5\"乘加乘减（基础/应用）：拓展《表内乘法》。攻克乘加乘减两步计算题，建立'先乘除后加减'顺序感，杜绝期中丢分。\"　A 给出了正确的运算顺序与训练方式。B 顺序说反了（\"先加减后乘除\"是错的），是最典型的混淆项。C 放弃规则，会纵容错误习惯。D 绕过能力养成，与\"建立顺序感\"的目标相悖。","score":2,"group":"S5","groupLabel":"产品知识上 · S5","id":"UP-S5-06"},{"q":"家长焦虑：\"孩子三年级突然就跟不上了，是不是态度出了问题？\" 按 S6，根本原因是：","opts":["是态度问题，需要加强管教和督促，先把学习习惯抓起来，态度端正了成绩自然跟着上","是老师教学水平的问题，换一个更适合孩子风格的老师就能明显改善","是孩子智力发展的问题，需要先做个专业测评看看真实水平再定","三年级是分水岭——分数登场、乘除变日常、应用题跃到三四步，要的是思维工具升级"],"correct":3,"explain":"【依据】S6 开篇：\"很多孩子在这个阶段出现明显的成绩波动，家长归结为'孩子不认真'，但根源在于知识体系和思维方式的全面升级。孩子需要的不是更多刷题，而是系统性的思维工具升级。\"　D 直引白皮书开篇判断，是回应\"突然跟不上\"的标准答案。A 停留在态度层面，看不到能力升级的真实需求。B 甩锅给师资。C 越界下智力判断。三者都无法给家长提供有价值的方案。","score":2,"group":"S6","groupLabel":"产品知识上 · S6","id":"UP-S6-01"},{"q":"家长说：\"孩子做'鸡兔同笼'这类题完全没有思路。\" 按 S6 暑期课程，正确的训练方向是：","opts":["直接背公式，考试遇到就套，这类题的题型就那几种，套对了就能得分，最省时间","这类题太难，可以先跳过，把基础题做稳，难题等能力够了以后再说","只有走奥数路线的孩子才需要学，普通孩子不必在这上面花时间精力","通过假设法与列表法建“先假设再调整”的思维模型，让他理解策略过程，而不是背结果"],"correct":3,"explain":"【依据】S6 暑期\"鸡兔同笼与倒水问题：攻克假设法与列表法经典策略题型，建'先假设再调整'思维模型\"；\"难题思路：【鸡兔同笼不求人】学会假设法、列表法等经典策略，面对经典数学趣题有方法有步骤\"。　D 抓住了策略类的训练本质——建模型、懂过程。A 的背公式在题型稍变时就会失效，与\"有方法有步骤\"的目标冲突。B 用跳过回避，而鸡兔同笼正是 S6 难题思路的代表模块。C 窄化了受众。","score":2,"group":"S6","groupLabel":"产品知识上 · S6","id":"UP-S6-06"},{"q":"家长说：\"孩子四年级，读得懂题但列不出式，我让他多刷题也没用。\" 按 S7，根本原因是：","opts":["孩子不够努力，需要加大练习量，练得多了手感就来了，思路自然也就打开了","思维方式要从“直觉型”升级为“建模型”——四年级是抽象思维转折点，缺的是画图建模能力","题目太难，已经超出了孩子目前的水平，先放缓进度让他慢慢适应","孩子语文功底差，读不懂题意，要先补阅读理解，再回头说数学"],"correct":1,"explain":"【依据】S7 开篇：\"很多孩子在这里出现'读得懂题但列不出式'的困境，家长们焦虑地发现——刷题已经不管用了。其实问题的本质不是不努力，而是思维方式需要从'直觉型'升级为'建模型'。\"　B 直引白皮书判断，把\"列不出式\"归因到\"缺建模思维\"，并点明刷题无效的原因。A 继续加量，正是白皮书否定的做法。C 用\"超纲\"回避。D 误判为语文问题——白皮书讲的是\"不会把文字描述转化为标准模型\"，属数学建模能力，不是阅读能力。","score":2,"group":"S7","groupLabel":"产品知识上 · S7","id":"UP-S7-01"},{"q":"家长说：\"平行四边形、三角形、梯形的面积公式我都让孩子背熟了，可题目一变他就懵。\" 按 S7，正确的判断是：","opts":["公式背得还不够熟，继续反复背，背到条件一变也能马上反应过来就不怕了","面积公式“不是背的，是能推导出来的”——要让孩子经历割补转化的推导过程，才能举一反三","只要把公式背熟就足够了，考试考的是代入计算，并不考推导过程","只做标准图形题，变式题可以不练，把标准题的分稳稳拿住最实在"],"correct":1,"explain":"【依据】S7\"难题思路：【面积会推导】平行四边形三角形梯形面积公式不是背的，是能推导出来的，举一反三\"；专题 9\"攻克面积推导与高线判断易错题，建'割补转化'推导力\"。　B 直引白皮书\"不是背的，是能推导的\"，并点出\"割补转化\"这一推导工具。A 继续加背诵量，无法解决\"一变就懵\"。C 与白皮书表述正面冲突。D 用回避替代——变式题恰恰检验推导理解，是 S7\"举一反三\"的核心。","score":2,"group":"S7","groupLabel":"产品知识上 · S7","id":"UP-S7-06"},{"q":"家长说：\"分数的约分通分，多练练不就好了？\" 按 S8，正确的判断是：","opts":["对，多练自然就熟，约分通分就是熟练度问题，练到位了就不会再错，不用讲道理","分数太难，长大一点自然会懂，现在不必死磕，先放着以后再说","约分不彻底、通分找错公倍数，本质是“因倍质合”没打透——分数运算的核心在因倍关系","可以用计算器绕开约分和通分，先用工具把正确率保住再说别的"],"correct":2,"explain":"【依据】S8\"分数不再'算崩'——打通因倍质合的底层逻辑\"；\"家长常见误判\"中\"分数的约分通分多练就好了\"一栏，底层问题是\"因倍质合基础没打透，分数运算的核心在因倍关系\"。　C 把\"算错约分通分\"上溯到\"因倍质合\"，这正是 S8 的主张——先打数论地基，再上分数运算。A 与\"打破机械背规则\"冲突。B 用\"长大就会\"回避。D 用工具替代能力，约分通分背后是对因数倍数的理解，工具无法替代。","score":2,"group":"S8","groupLabel":"产品知识上 · S8","id":"UP-S8-01"},{"q":"家长说：\"孩子做'火车相遇''火车追及'总错，是不是这类题太难了？\" 按 S8，正确的思路是：","opts":["太难了，可以先放弃，这部分考试占比不大，性价比不高，把会做的分拿稳更实际","直接背“相遇时间 = 路程 ÷ 速度和”，代入数字就能出结果","只做最简单的行程题，复杂的等以后能力够了再去碰它","火车行程有特殊性——车有“车身长度”，要建特殊行程模型，再用方程法统一建模"],"correct":3,"explain":"【依据】S8 专题 12\"火车相遇与追及：突破《行程问题》专题。攻克火车与人、火车与火车相追题，建'车身长度'特殊行程模型\"；\"行程综合建模：攻克多对象多阶段复杂行程题，用方程法统一建模\"。　D 指出了火车行程题的**特殊性**（车身长度）与**统一解法**（方程建模），这是白皮书明确的进阶方向。A、C 用回避取代学习，而火车相遇正是 S8 的模块内容。B 把 S7 的基础公式简单照搬，忽略了车身长度带来的变量，正是\"套模板失效\"的典型。","score":2,"group":"S8","groupLabel":"产品知识上 · S8","id":"UP-S8-06"},{"q":"家长说：\"六年级内容不多了，主要就是复习吧？\" 按 S9，正确的判断是：","opts":["六年级是“新学 + 综合”的双重压力——上学期还有圆、百分数、比等新知识，不是单纯复习","对，六年级主要就是复习，没什么新内容，把小学六年学过的东西过一遍就好","六年级不太重要，随便学学就行，反正小升初主要还是看基础","六年级只需要复习，不用学新知识，新知识等到初中再学也不迟"],"correct":0,"explain":"【依据】S9\"家长常见误判\"中\"六年级内容不多，主要是复习\"一栏，底层问题是\"'新学 + 同步综合'的双重压力被低估。六年级上还有圆、百分数、比等大量新知识。\"　A 纠正了家长\"六年级≈复习\"的普遍错觉，点明\"新学 + 综合\"的双重压力。B、D 延续了同一误判。C 贬低了收官年的价值，与\"决定小升初最终成绩\"的定位冲突。","score":2,"group":"S9","groupLabel":"产品知识上 · S9","id":"UP-S9-01"},{"q":"家长说：\"孩子六年级的圆和扇形总错，一到曲边图形就完全不知道从哪入手。\" 按 S9，正确的思路是：","opts":["圆太难，可以先放弃，曲边图形在小升初考试里占比不大，把会做的分拿稳更实际","只要把 πr² 这个公式背下来就行，圆的题目都是套公式","只做标准圆的题目，不做组合图形，组合图形又绕又难","先理解圆的周长面积从“割圆”怎么推导，曲边图形用割补化归成熟悉图形"],"correct":3,"explain":"【依据】S9\"圆和扇形不再'沦陷'——从公式记忆到推导运用\"：\"先理解圆的周长和面积如何从'割圆'推导而来，再掌握扇形与整体圆的比例关系，曲边图形用'割补拼合'策略化归。\"　D 完整复刻白皮书的三层思路（推导理解 → 比例关系 → 割补化归）。A、C 用回避取代学习。B 只背一个公式，遇到曲边组合图形无从下手——白皮书特别强调\"曲边图形有策略不畏惧\"。","score":2,"group":"S9","groupLabel":"产品知识上 · S9","id":"UP-S9-06"},{"q":"家长问：\"加减法怎么教才对？我直接让孩子把 20 以内加减答案背下来行不行？\" 关于 S3 的\"加减算理\"，正确的是：","opts":["直接把 20 以内加减的答案背下来，越熟越好，考试时又快又稳不出错","减法就是“拿走了”，不用特意讲意义，孩子记住动作含义就能做题了","从实物操作到图示再到心算，完整走过“具象 → 形象 → 抽象”；理解算理比记住答案重要得多","大班只学 10 以内就够了，20 以内的加减等上了小学老师自然会教"],"correct":2,"explain":"【依据】S3\"加减不是'背答案'——从'动手分'到'心里算'\"：帮孩子完整经历\"具象 → 形象 → 抽象\"的思维发展全过程；\"理解算理比记住答案重要一百倍\"。　C 完整复刻了白皮书的三级过渡路径。A 与\"理解算理比记住答案重要一百倍\"直接对立。B 只讲动作不讲意义，正是白皮书批评的\"记步骤\"。D 擅自压缩学段范围——S3 明确要求\"理解加减算理，计算 20 以内加减\"。","score":2,"group":"S3","groupLabel":"产品知识上 · S3","id":"UP-S3-04"},{"q":"家长说：\"三年级的应用题，多读两遍不就想出来了吗？\" 按 S6，正确的是：","opts":["对，多读几遍自然就能想出来，题读熟了关系就理清了，理解能力是关键","多步题只要列成一个综合算式就行，步骤写多了反而容易出错","三四步题难在“中间问题链”——先求什么、怎么连，光多读不够，要用“中间问题法”拆解","多步题太难，可以先放弃，把两步题做稳就够应付考试了，性价比更高"],"correct":2,"explain":"【依据】S6\"多步题不再空——学会'问题链拆解法'\"：\"引入'中间问题链'——先求什么 → 已知什么 → 怎么连起来，把三四步大题拆成可解的小步。\"　C 说清了多步题的真难点与解法。A 是家长的典型乐观误判，也是白皮书要求纠正的\"读题不清导致的结构误判\"。B 只求形式（综合算式），没有解决\"从哪一步开始想\"的问题。D 用放弃回避——多步题正是 S6 的核心训练目标。","score":2,"group":"S6","groupLabel":"产品知识上 · S6","id":"UP-S6-04"},{"q":"豌豆益智课程的班型设置，下列说法正确的是？","opts":["固定一周 3 节课，全级别统一为满班 8 人班，人数不做区分","固定一周 2 节课，S1 为满班 6 人班，S2 至 S9 为满班 8 人班","固定一周 2 节课，全级别统一为满班 6 人班，保证老师关注度","一周课节数不固定，满班人数按报名情况在 6 到 8 人之间浮动"],"correct":1,"explain":"【依据】第 3 页「班型设置：固定一周 2 节课；S1 满班 6 人班；S2-S9 满班 8 人班」　B 三项全对。C 把 S2-S9 的 8 人班错成 6 人；A 连每周节数也错了；D 把排班时的临时余量当成规则。同页还有一条要一起记：授课语言支持普通话、粤语、全英、中英（中教/外教），台湾为普通话繁体课件。","score":4,"group":"M1","groupLabel":"产品知识下 · 课程设置与排课","id":"DOWN-01"},{"q":"系统会自动预排未来 7 节课程，这 7 节课的课时如何处理？","opts":["提前消耗 7 课时用于占位，并非真实划扣，课时并没有减少","属于系统多扣，需提交工单登记后由人工核实并追回","已真实划扣 7 课时，后续上课不会再重复扣，属正常扣费","每上完一节退回一节，实际可用课时比页面显示少 7 节"],"correct":0,"explain":"【依据】第 3 页「系统会自动预排未来 7 节课程（提前消耗 7 课时，并非真实划扣）」　A 抓住两个关键词——\"提前消耗\"和\"并非真实划扣\"，缺一不可。C 把\"预占\"说成\"已扣\"，方向完全相反；D 自创\"上完一节退回一节\"的机制；B 把规则问题当成系统故障去提工单，会把简单的解释升级成事故。","score":4,"group":"M1","groupLabel":"产品知识下 · 课程设置与排课","id":"DOWN-03"},{"q":"老生停课后复课、或新生开课需要插班时，进入的讲次按什么规则计算？","opts":["每个专题 4 节课，第一讲一定是双数，按 4X-2 讲计算（X 为专题数）","一个级别共 24 个专题，第一讲按 4X+1 讲计算，避免讲次编号重复","一个专题 6 个讲次，第一讲按 6X-5 讲计算（X 为专题数）","每个专题 4 节课，第一讲一定是单数，按 4X-3 讲计算（X 为专题数）"],"correct":3,"explain":"【依据】第 5 页「共 9 个级别，每一级别 96 节课，分 A、B、C、D 四个阶段；每阶段 6 个专题，每专题 4 讲次，一个级别共 24 个专题」；第 6 页「每个 4 节课一个完整专题，专题的第一讲一定是一个单数，即 4X-3 讲」　D 正确——4X-3（X 为专题数）一定是单数，这就是\"卡专题第一讲\"的算法依据。A 把单数说成双数、公式差 1；B、C 的专题结构本身就错（每专题 4 讲，不是 6 讲）。背景数据一并记：9 级 × 每级 96 节，每级 4 阶段 × 6 专题 × 4 讲。","score":4,"group":"M1","groupLabel":"产品知识下 · 课程设置与排课","id":"DOWN-05"},{"q":"关于家长端请假的时间边界，下列说法正确的是？","opts":["家长端请假没有时间限制，开课前任何时间都能自主操作","课前 15 分钟起家长无法操作请假，但 LP 和主讲老师可以操作","课前 15 分钟起所有人都无法操作请假，只能按旷课处理","课前 15 分钟起家长不能操作，只能打电话给客服人工登记"],"correct":1,"explain":"【依据】第 7 页「建议告知家长提前 24 小时请假，最晚可自主通过豌豆素质家长端操作（课程协议是提前 3 小时）；课前 15 分钟，家长无法操作请假，LP 和主讲老师可以操作」　B 给出的是精确边界——15 分钟是**家长端**的分界线，但请假这件事仍可由 LP 或主讲老师操作，两个概念不能混。C 把\"家长不能操作\"等同于\"不能请假\"，还会误记旷课（旷课才扣 1 课时）；A 无视时间限制；D 的\"打电话给客服\"是编出来的流程。建议口径一并记住：建议提前 24 小时，课程协议是提前 3 小时。","score":4,"group":"M2","groupLabel":"产品知识下 · 请假、补课与休学","id":"DOWN-07"},{"q":"两种补课方式与课时扣除的对应关系是？","opts":["直播补课（插班真人补课）扣除课时，AI 补课（课程回放）不扣课时","两种补课都不扣课时，由系统自动安排，家长无需关心费用","AI 补课扣除课时，直播补课不扣，真人课成本更高所以免费","两种都扣课时，直播补课扣 1 节，AI 补课扣半节，可自行选择"],"correct":0,"explain":"【依据】第 7 页「补课——直播补课（插班真人补课），扣除课时；AI 补课（课程回放），不扣课时」　A 是唯一把\"哪种补课扣费\"对应对的。C 把扣费关系说反了；D 自创\"扣半节\"，课包计量里没有这种单位；B 的\"都不扣\"是最容易被顺着家长说的错话。这条也是向家长推荐 AI 补课的价值点——不扣课时。","score":4,"group":"M2","groupLabel":"产品知识下 · 请假、补课与休学","id":"DOWN-09"},{"q":"关于停课（休学）规则，下列说法正确的是？","opts":["不同课包停课机会相同，一次最长 60 天，停课期间课时完全冻结","停课时间不限，想停多久都可以，复课时再联系 LP 排课即可","一次办理不超过 30 天，到 31 天未排课会自动按每周 2 节划扣课时","课包不支持停课，只能继续上课或直接办理退费，没有中间选项"],"correct":2,"explain":"【依据】第 8 页「休学规则——不同课包对应不同停课机会，一次办理不超过 30 天，到 31 天未排课会自动按照每周 2 节划扣课时（特殊情况可延长）」　C 把两个关键数字都说准了——30 天上限、第 31 天起自动按每周 2 节划扣。A 的 60 天是最常见的误记，且\"完全冻结\"与规则相反；B 的\"不限时长\"错得最离谱，会让家长白白损失课时；D 直接否定，把一个能解决的问题推成退费。另注：停课机会次数因课包而异，特殊情况可延长。","score":4,"group":"M2","groupLabel":"产品知识下 · 请假、补课与休学","id":"DOWN-11"},{"q":"新生消耗课时在 4 节课内申请退费，处理方式是？","opts":["按“购买价格 ÷ 基础直播课时 × 已上课时”扣费，退还剩余金额","需扣除已上课时费用，剩余部分走财务线下打款，约 1 个月到账","课包一经消耗不支持退费，只能把剩余课时转给其他孩子使用","属于无忧试学范围，可全额退费，不扣除已上课时的费用"],"correct":3,"explain":"【依据】第 9 页「退费——新生消耗课时，4 节课内：无忧试学，全额退费」　D 卡准\"四节课内\"这个边界。A、B 都提前套用了\"超过 4 节\"的算法，把本可全额退的单子算成扣费单；C 的\"不支持退费\"与无忧试学政策直接冲突。处理这类单子，第一步永远是先确认已上课时数。","score":4,"group":"M3","groupLabel":"产品知识下 · 退费与挽单","id":"DOWN-13"},{"q":"新生超过 4 节课申请退费，扣费金额如何计算？","opts":["按“购买价格 ÷ 基础直播课时（不含赠课）× 已上课时”计算，以系统自动结算为准","按“购买价格 ÷ 总课时（含赠课）× 已上课时”计算，赠课一并摊入总数","按“已上课时 × 单节正价”计算，剩余部分全退，不产生任何手续费","超过 4 节课的课包不再退费，剩余课时只能转赠给其他孩子使用"],"correct":0,"explain":"【依据】第 9 页「超过 4 节课退费：购买价格/基础直播课时（不含赠课）×已上课时=扣费金额，以系统自动结算为准」　A 的关键在分母是\"基础直播课时（**不含赠课**）\"——把赠课算进分母会摊薄单价、算高已上课时金额，家长吃亏，也最容易在退款金额上起争议，B 正是这个误区。C 忽略了合同价与单节价的差异；D 直接违反退费政策。\"以系统自动结算为准\"要一并说，避免家长手算后对不上。","score":4,"group":"M3","groupLabel":"产品知识下 · 退费与挽单","id":"DOWN-14"},{"q":"关于退费的挽单分工与流程，下列说法正确的是？","opts":["四节课内归 LP 挽单，需走完整一挽二挽流程，失败 24 小时内 OA 发起","四节课外归 CC 挽单，LP 只负责记录原因，结果与 LP 没有关系","四节内归 CC 挽、四节外归 LP 挽；LP 须走一挽二挽，失败 48 小时 OA 发起","挽单由签单的 CC 全程负责跟进，LP 只在家长坚持退费时办理手续"],"correct":2,"explain":"【依据】第 9 页「挽单——四节课内：CC 挽单；四节课外：LP 挽单。LP 挽单必须要有完整的一挽二挽流程，挽单失败 48 小时 OA 发起退费申请」　C 三个要素全对——4 节内归 CC、4 节外归 LP、LP 须走完整一挽二挽且失败 48 小时 OA 发起。A 把\"4 节内 / 4 节外\"的分界记反，时效也记成 24 小时；B 把 LP 的核心挽单责任推给 CC；D 的\"谁签谁挽\"不是规则，分工只看已上课时数。","score":4,"group":"M3","groupLabel":"产品知识下 · 退费与挽单","id":"DOWN-15"},{"q":"关于课后巩固（每节课）的入口、题量与注意事项，下列说法正确的是？","opts":["入口在家长端 APP，题量 8 题左右，以测试形式呈现并出报告","入口在学生端，题量 6 题左右，注意中途退出需重新开始做题","入口在学生端，每专题结束后做一次，题量 8 题左右","没有线上巩固，全靠纸质豌豆宝典，做完拍照发给 LP 批改"],"correct":1,"explain":"【依据】第 25 页「课后巩固（每节课）：入口豌豆素质学生端；题量 6 题左右；题型选择、填空、连线、拖拽；频率每节课结束后；注意：中途退出需重新开始做题」　B 把入口、题量、易漏的注意事项都说对。A 的\"家长端 + 8 题\"混进了思维自评的特征；C 把\"每节课\"错成\"每专题\"；D 忽略了线上巩固的存在。题型是选择、填空、连线、拖拽，频率为每节课结束后——家长反馈\"孩子做了一半没了\"，多半就是中途退出了。","score":4,"group":"M4","groupLabel":"产品知识下 · 学习闭环与课后配套","id":"DOWN-17"},{"q":"专题复习（AI 复习课）与思维自评的生成条件，区别在哪？","opts":["两者都要求专题 4 节课全部正常出席，缺勤就无法生成","思维自评要求 4 节全部正常出席；专题复习只要 4 节课结束就生成","两者都只要专题 4 节课结束就会生成，与出勤情况没有关系","专题复习要求 4 节全部正常出席；思维自评只要专题 4 节课结束就生成"],"correct":3,"explain":"【依据】第 25 页「专题复习（每专题）：入口豌豆素质学生端-豌豆游乐园，形式 AI 复习课，生成条件：专题 4 节课全部正常出席（有请假、旷课、补课都无法生成）；思维自评（每专题）：入口学生端-我的自评，形式测试，题量 8 题左右，生成条件：专题 4 节课结束后（有请假、旷课、补课都会生成）」　D 是全 PPT 最容易记混的一对：**专题复习卡出勤，思维自评不卡**。A 把两者一起判死；B 把条件安反了对象；C 抹平了差异。LP 记反这条，家长的追问就会变成\"你们系统是不是坏了\"——正确做法是主动解释\"复习课要 4 节全勤才生成，自评不受影响\"。","score":4,"group":"M4","groupLabel":"产品知识下 · 学习闭环与课后配套","id":"DOWN-18"},{"q":"关于课堂回放，下列说法正确的是？","opts":["有效期 30 天，入口只在学生端；生成只与老师是否开启录制有关","有效期 180 天，但只在家长端能看；回放一定能生成，找不到就是被删","有效期 180 天，入口在学生端和家长端；生成与设备内存、网络、是否立即退教室有关","有效期一年，入口在学生端和家长端；生成与设备内存、网络无关"],"correct":2,"explain":"【依据】第 24 页「课堂回放：入口豌豆素质学生端、豌豆素质家长端 APP；形式课堂互动录频，不可操作；有效期 180 天；生成条件：与设备剩余内存、用户端网络、下课后不要立即退出教室等原因有关」　C 把时限、入口、生成条件三点都说对。A 的 30 天记短了，入口也漏了家长端；B 说\"一定能生成\"——回放生成本身受客户端条件影响；D 的一年期限和\"与设备无关\"都不成立。可以据此做预防性提示：下课后不要立即退出教室。","score":4,"group":"M4","groupLabel":"产品知识下 · 学习闭环与课后配套","id":"DOWN-19"},{"q":"V9 课件「升级一：课程适配度升级」包含哪些内容？","opts":["全级别统一更换新课件，只是换皮，难度、课节数和课节安排都完全不变","S1-S3 删减超纲内容，S4-S9 全部新增英文课件，全面向海外课纲看齐","只升级界面与动画效果，课程内容、课节数和难度都没有做任何调整","S4-S7 删减超纲过难的课；S7 新增北美、新加坡四年级校内重难点；S8 新增英文课件"],"correct":3,"explain":"【依据】第 35 页「升级一：课程适配度升级——1）S4-S7 难度和课节删减（总框架不变，特色课程保留，超纲和难度过高课程删减）；2）V8 版本的 S7 级别校内课程严重缺失，新增北美和新加坡四年级校内内容重难点；3）S8 新增英文课件，本地化语言，内容向海外课纲难度靠近」　D 三条都对。A 的\"只是换皮\"否定了删减的价值——删掉的恰恰是超纲和过难内容，这是卖点不是缩水；B 把删减范围错到 S1-S3、把英文课件安到 S4-S9；C 完全否定内容变化，家长后续发现课节数变了，会认为是偷偷缩水。","score":4,"group":"M5","groupLabel":"产品知识下 · V9 升级与豌豆币","id":"DOWN-21"},{"q":"关于豌豆币的兑换规则，下列说法正确的是？","opts":["6000 豌豆币 = 1 节直播课，每日兑换上限 5 节","1 万豌豆币 = 1 节直播课，兑换不限次数，可一直攒着","8000 豌豆币 = 1 节直播课，每日兑换上限 10 节","8000 豌豆币 = 1 节直播课，但仅限兑换录播课和实物礼品"],"correct":2,"explain":"【依据】第 41 页「豌豆币是豌豆商城里面【积分】的另一种称呼，用户可以在豌豆商城使用豌豆币兑换实物礼品、直播课时、各类录播课等。（8000 豌豆币 = 1 节直播课，每日兑换上限：10 节）」　C 两个数字都对——8000 兑 1 节、每日上限 10 节。A、B 的数字是常见误记；D 的\"仅限录播课和实物礼品\"漏掉了直播课时，豌豆币三类都能换。兑换入口在第 24 题一起考。","score":4,"group":"M5","groupLabel":"产品知识下 · V9 升级与豌豆币","id":"DOWN-23"},{"q":"豌豆币的有效期是多久？在哪儿兑换使用？","opts":["自获得之日起次年 12 月 31 日清零，在家长端 APP 的豌豆商城兑换","永久有效不会清零，登录家长端 APP 进入豌豆商城即可兑换","当年 12 月 31 日清零，在学生端的豌豆游乐园里兑换礼品","有效期三年，到期自动兑换成课时，不需要家长手动操作"],"correct":0,"explain":"【依据】第 41 页「豌豆币如何使用：登录豌豆素质家长端 APP，进入豌豆商城，选择心仪的物品即可兑换。豌豆币有效期：自获得之日起，次年 12 月 31 日清零」　A 正确——**次年** 12 月 31 日清零，兑换入口在家长端 APP 的豌豆商城。C 把\"次年\"错成\"当年\"；B 的\"永久有效\"最危险，家长攒着不用、跨年清零极易引发投诉，LP 要主动提醒。获取途径一并记：购买正课包、参与周周打卡、邀请好友出席试听、参与豌豆素质教育服务号不定期推出的各类活动。","score":4,"group":"M5","groupLabel":"产品知识下 · V9 升级与豌豆币","id":"DOWN-24"}]}}</script>
